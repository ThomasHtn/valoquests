# =============================================================================
# Database
# =============================================================================

# In-memory H2 database configured to emulate PostgreSQL.
spring.datasource.url=jdbc:h2:mem:valorant;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver

# Create and drop the schema for each test execution.
spring.jpa.hibernate.ddl-auto=create-drop

# Flyway is disabled because the schema is generated automatically.
spring.flyway.enabled=false


# =============================================================================
# Application settings
# =============================================================================

# Test configuration used by integration tests.
app.frontend-origin=http://localhost:4200
app.admin-api-key=test-admin-key


# =============================================================================
# Henrik API client
# =============================================================================

# Fake Henrik API configuration used during tests.
henrik.api.base-url=http://localhost
henrik.api.key=test-api-key
henrik.api.region=eu
henrik.api.platform=pc

# Short timeouts keep failing tests fast.
henrik.api.connect-timeout=PT1S
henrik.api.read-timeout=PT1S

# Disable retries to keep test execution deterministic.
henrik.api.max-attempts=1
henrik.api.retry-delay=PT0.001S
