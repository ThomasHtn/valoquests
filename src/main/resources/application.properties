# =============================================================================
# Application identity
# =============================================================================
spring.application.name=valorant-tracker

# =============================================================================
# PostgreSQL datasource
# Environment variables override the local default values.
# =============================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/valorant_tracker}
spring.datasource.username=${DB_USERNAME:valorant}
spring.datasource.password=${DB_PASSWORD:valorant}

# =============================================================================
# JPA and Hibernate
# The schema is managed by Flyway; Hibernate only validates it at startup.
# =============================================================================
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# =============================================================================
# Flyway database migrations
# =============================================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# =============================================================================
# JSON serialization
# Null properties are omitted and all timestamps use UTC.
# =============================================================================
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=UTC

# =============================================================================
# HTTP server
# Graceful shutdown lets in-flight requests finish during application shutdown.
# =============================================================================
server.shutdown=graceful

# =============================================================================
# Actuator
# Only operationally useful endpoints are exposed over HTTP.
# =============================================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.version=@project.version@

# =============================================================================
# OpenAPI and Swagger UI
# Swagger UI: http://localhost:8080/swagger-ui.html
# OpenAPI JSON: http://localhost:8080/api-docs
# OpenAPI YAML: http://localhost:8080/api-docs.yaml
# =============================================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.document-title=Valorant Tracker API
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.packages-to-scan=io.github.thomashtn.valorant.tracker
springdoc.paths-to-match=/api/**

# =============================================================================
# Application-specific settings
# =============================================================================
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:4200}
app.admin-api-key=${ADMIN_API_KEY:local-development-admin-key}
app.scheduling.standard-synchronization-delay=${STANDARD_SYNC_DELAY:PT4H}
app.scheduling.deep-synchronization-delay=${DEEP_SYNC_DELAY:PT10M}

# =============================================================================
# Henrik API client
# =============================================================================
henrik.api.base-url=${HENRIK_API_BASE_URL:https://api.henrikdev.xyz}
henrik.api.key=${HENRIK_API_KEY:}
henrik.api.connect-timeout=PT5S
henrik.api.read-timeout=PT20S

# =============================================================================
# Logging
# =============================================================================
logging.level.io.github.thomashtn.valorant.tracker=INFO
