# =============================================================================
# Application
# =============================================================================
# Application identity used by Spring Boot and Actuator.
spring.application.name=valorant-tracker
# =============================================================================
# Database
# =============================================================================
# PostgreSQL connection. Environment variables override local defaults.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/valorant_tracker}
spring.datasource.username=${DB_USERNAME:valorant}
spring.datasource.password=${DB_PASSWORD:valorant}
# =============================================================================
# JPA and Hibernate
# =============================================================================
# Flyway manages the schema; Hibernate only validates it at startup.
spring.jpa.hibernate.ddl-auto=validate
# Prevent database access during HTTP response serialization.
spring.jpa.open-in-view=false
# Store and read database timestamps in UTC.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Optimize the loading of lazy associations.
spring.jpa.properties.hibernate.default_batch_fetch_size=50
# =============================================================================
# Flyway
# =============================================================================
# Apply and validate database migrations at startup.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
# =============================================================================
# JSON serialization
# =============================================================================
# Exclude null properties and serialize dates using UTC.
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=UTC
# =============================================================================
# HTTP server
# =============================================================================
# Allow in-flight requests to finish during application shutdown.
server.shutdown=graceful
# =============================================================================
# Actuator
# =============================================================================
# Expose only useful operational endpoints.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
# Application metadata exposed through the information endpoint.
info.app.name=${spring.application.name}
info.app.version=@project.version@
# =============================================================================
# OpenAPI and Swagger UI
# =============================================================================
# Swagger UI:   http://localhost:8080/swagger-ui.html
# OpenAPI JSON: http://localhost:8080/api-docs
# OpenAPI YAML: http://localhost:8080/api-docs.yaml
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.document-title=Valorant Tracker API
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.try-it-out-enabled=true
# Restrict generated documentation to the application API.
springdoc.packages-to-scan=io.github.thomashtn.valorant.tracker
springdoc.paths-to-match=/api/**
# =============================================================================
# Application settings
# =============================================================================
# Angular frontend origin allowed by the backend.
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:4200}
# Secret used to protect administrative endpoints.
app.admin-api-key=${ADMIN_API_KEY:local-development-admin-key}
# Delay between scheduled synchronization executions.
app.scheduling.standard-synchronization-delay=${STANDARD_SYNC_DELAY:PT4H}
app.scheduling.deep-synchronization-delay=${DEEP_SYNC_DELAY:PT10M}
# =============================================================================
# Henrik API client
# =============================================================================
# HenrikDev connection and authentication.
henrik.api.base-url=${HENRIK_API_BASE_URL:https://api.henrikdev.xyz}
henrik.api.key=${HENRIK_API_KEY:}
# Region and platform shared by all tracked players.
henrik.api.region=${HENRIK_API_REGION:eu}
henrik.api.platform=${HENRIK_API_PLATFORM:pc}
# HTTP connection and response timeouts.
henrik.api.connect-timeout=${HENRIK_API_CONNECT_TIMEOUT:PT5S}
henrik.api.read-timeout=${HENRIK_API_READ_TIMEOUT:PT20S}
# Retry configuration for temporary Henrik API failures.
# The initial request counts as the first attempt.
# A value of 2 means one initial request and one retry.
henrik.api.max-attempts=${HENRIK_API_MAX_ATTEMPTS:2}
# Minimum delay before retrying a temporary Henrik API failure.
# For rate-limit responses, the Retry-After header should take precedence
# when it contains a greater delay.
henrik.api.retry-delay=${HENRIK_API_RETRY_DELAY:PT60S}
# Maximum request rate shared by every Henrik API client.
# The limiter distributes requests evenly instead of sending request bursts.
# The current Henrik API key allows 30 requests per minute, but 28 leaves
# a small safety margin for timing differences or manual requests.
henrik.api.requests-per-minute=${HENRIK_API_REQUESTS_PER_MINUTE:28}
# Additional safety duration added to the theoretical interval between requests.
henrik.api.rate-limit-safety-margin=${HENRIK_API_RATE_LIMIT_SAFETY_MARGIN:PT0.1S}
# =============================================================================
# Logging
# =============================================================================
# Default log level for application packages.
logging.level.io.github.thomashtn.valorant.tracker=INFO
