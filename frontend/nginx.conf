server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	gzip on;
	gzip_types text/plain text/css application/javascript application/json image/svg+xml;

	# Angular SPA: unknown paths fall back to index.html for client-side routing.
	# $uri/ is deliberately excluded: static asset directories under public/ (e.g. players/)
	# would otherwise shadow same-named Angular routes and 403 instead of serving the app.
	location / {
		try_files $uri /index.html;
	}
}
