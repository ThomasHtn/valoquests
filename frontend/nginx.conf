server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	gzip on;
	gzip_types text/plain text/css application/javascript application/json image/svg+xml;

	# Sent on every response, including the SPA shell and its assets. Traefik terminates HTTPS in
	# front of this container, so HSTS belongs there, not here.
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;

	# Angular emits every bundle and stylesheet with a content hash in its name
	# ("outputHashing": "all" in angular.json), so a given URL never changes content.
	location ~* \.(?:js|css|woff2)$ {
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-Frame-Options "DENY" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Cache-Control "public, max-age=31536000, immutable" always;
	}

	# Unhashed assets served straight from public/: cached, but revalidated often enough that
	# replacing an avatar or a translation dictionary shows up the same day.
	location ~* \.(?:svg|webp|png|ico|json)$ {
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-Frame-Options "DENY" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Cache-Control "public, max-age=3600" always;
	}

	# Angular SPA: unknown paths fall back to index.html for client-side routing.
	# $uri/ is deliberately excluded: static asset directories under public/ (e.g. players/)
	# would otherwise shadow same-named Angular routes and 403 instead of serving the app.
	location / {
		# The shell names the hashed bundles, so caching it would pin clients to a stale
		# deployment long after the assets it points at were replaced.
		add_header Cache-Control "no-cache" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-Frame-Options "DENY" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;

		try_files $uri /index.html;
	}
}
