<!-- Bypass block (WCAG 2.4.1): the sidebar repeats on every route, so keyboard users get a way
     to jump straight to the routed content. Visible only while focused. -->
<a
  class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 focus:z-50 focus:rounded-lg focus:bg-surface-800 focus:px-4 focus:py-2 focus:text-sm focus:font-semibold focus:text-text-primary"
  href="#main-content"
>
  {{ 'skipToContent' | translate }}
</a>

<div class="flex h-screen overflow-hidden bg-surface-950">
  <!-- Persistent navigation sidebar, shown on every route. -->
  <app-sidebar />

  <!-- Routed page content. -->
  <main class="flex-1 overflow-y-auto p-6" id="main-content" tabindex="-1">
    <router-outlet />
  </main>
</div>
