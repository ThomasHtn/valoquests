<section class="overflow-hidden rounded-xl border border-surface-700 bg-surface-900">
  <!-- Disclosure header -->
  <header [class.border-b]="expanded()" class="border-surface-700">
    <button
      (click)="toggle()"
      [attr.aria-controls]="contentId"
      [attr.aria-expanded]="expanded()"
      class="focus-ring-inset flex w-full cursor-pointer items-center gap-2 px-5 py-4 text-left transition-[background-color,scale] hover:bg-surface-800 motion-safe:active:scale-[0.96]"
      type="button"
    >
      <ng-content select="[cardIcon]" />
      <h2 class="text-sm font-bold tracking-wide text-text-primary uppercase">{{ heading() }}</h2>
      <ng-content select="[cardMeta]" />
      <svg
        [class.-rotate-90]="!expanded()"
        class="ml-auto h-4 w-4 shrink-0 text-text-secondary transition-transform duration-200 motion-reduce:transition-none"
        lucideChevronDown
      ></svg>
    </button>
  </header>

  <!-- Collapsible body -->
  <div [hidden]="!expanded()" [id]="contentId">
    <ng-content />
  </div>
</section>
