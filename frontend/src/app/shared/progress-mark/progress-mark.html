@let mark = this.mark();

<!-- Assistive tech reads the exact figures from the sr-only span. -->
<span
  [appTooltipTemplate]="tip"
  [appTooltip]="mark.tip"
  aria-hidden="true"
  class="progress-mark__cell"
>
  @if (mark.done) {
    <span appInView class="progress-mark__dial progress-mark__dial--done">
      <svg class="progress-mark__dial-face" viewBox="0 0 48 48">
        <circle class="progress-mark__track" cx="24" cy="24" r="21" />
        <circle class="progress-mark__arc fx-arc" cx="24" cy="24" r="21" />
        <circle class="progress-mark__disc" cx="24" cy="24" r="22.5" />
      </svg>
      <svg class="progress-mark__check" lucideCheck></svg>
      @for (piece of confetti; track $index) {
        <span
          [class.progress-mark__piece--pale]="piece.pale"
          [class.progress-mark__piece--strip]="piece.strip"
          [style.--angle.deg]="piece.angle"
          [style.--reach.rem]="piece.distance"
          [style.--spin.deg]="piece.spin"
          class="progress-mark__piece"
        ></span>
      }
    </span>
  } @else if (mark.idle) {
    <span class="progress-mark__dash">—</span>
  } @else {
    <span [style.--level]="mark.fraction" appInView class="progress-mark__dial">
      <svg class="progress-mark__dial-face" viewBox="0 0 48 48">
        <circle class="progress-mark__track" cx="24" cy="24" r="21" />
        <circle class="progress-mark__arc fx-arc" cx="24" cy="24" r="21" />
      </svg>
      <span [class.progress-mark__label--long]="hasLongFigure()" class="progress-mark__label"
        >{{ mark.figure }}
        @if (mark.unit) {
          <span class="progress-mark__unit">{{ mark.unit }}</span>
        }
      </span>
    </span>
  }
</span>
<span class="sr-only">{{ mark.tip }}</span>

<ng-template #tip><app-progress-tip [detail]="mark.detail" /></ng-template>
