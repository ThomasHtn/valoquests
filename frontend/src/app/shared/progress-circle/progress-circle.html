<svg class="h-full w-full -rotate-90" viewBox="0 0 36 36">
  <!-- Track. Lighter than the surrounding surface rather than darker: the ring sits on a row washed
       with `text-primary/4`, and a track darker than that read as a hole rather than as the unfilled
       half of a ring. -->
  <circle
    class="text-text-primary/12"
    [attr.r]="radius"
    cx="18"
    cy="18"
    fill="none"
    stroke="currentColor"
    stroke-width="5"
  />
  <!-- Filled arc -->
  <circle
    [attr.r]="radius"
    [attr.stroke-dasharray]="circumference"
    [attr.stroke-dashoffset]="dashOffset()"
    [class]="colorClass()"
    cx="18"
    cy="18"
    fill="none"
    stroke="currentColor"
    stroke-linecap="round"
    stroke-width="5"
  />
</svg>
