<svg class="h-full w-full -rotate-90" viewBox="0 0 36 36">
  <!-- Track -->
  <circle
    class="text-surface-700"
    [attr.r]="radius"
    cx="18"
    cy="18"
    fill="none"
    stroke="currentColor"
    stroke-width="3"
  />
  <!-- Filled arc -->
  <circle
    [attr.r]="radius"
    [attr.stroke-dasharray]="circumference"
    [attr.stroke-dashoffset]="dashOffset()"
    [class]="colorClass()"
    cx="18"
    cy="18"
    fill="none"
    stroke="currentColor"
    stroke-linecap="round"
    stroke-width="3"
  />
</svg>
