<app-empty-illustration [kind]="plate().illustration" class="empty-plate__illustration" />

@if (plate().eyebrow; as eyebrow) {
  <p
    [class.empty-plate__eyebrow--waiting]="tone() === 'waiting'"
    class="empty-plate__eyebrow label-caption"
  >
    <span aria-hidden="true" class="empty-plate__eyebrow-mark clip-hex"></span>
    {{ eyebrow }}
  </p>
}

<h2 class="empty-plate__title">
  {{ plate().title }}
</h2>

<p class="empty-plate__text">{{ plate().text }}</p>

@if (plate().readouts.length > 0) {
  <ul class="mt-1.5 flex flex-wrap justify-center gap-x-7 gap-y-2">
    @for (readout of plate().readouts; track readout.label) {
      <li class="empty-plate__readout label-caption">
        <span
          [class]="readoutDotClasses[readout.tone]"
          aria-hidden="true"
          class="empty-plate__dot"
        ></span>
        <span class="empty-plate__readout-label">{{ readout.label }}</span>
        <span
          [class.empty-plate__readout-value--live]="readout.tone === 'live'"
          class="empty-plate__readout-value"
          >{{ readout.value }}</span
        >
      </li>
    }
  </ul>
}
