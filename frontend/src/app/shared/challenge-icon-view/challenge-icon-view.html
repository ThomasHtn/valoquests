<!-- Icon -->
@switch (icon()) {
  @case ('skull') {
    <svg class="h-full w-full" lucideSkull></svg>
  }
  @case ('crosshair') {
    <svg class="h-full w-full" lucideCrosshair></svg>
  }
  @case ('trophy') {
    <svg class="h-full w-full" lucideTrophy></svg>
  }
  @case ('users') {
    <svg class="h-full w-full" lucideUsers></svg>
  }
  @case ('star') {
    <svg class="h-full w-full" lucideStar></svg>
  }
  @case ('swords') {
    <svg class="h-full w-full" lucideSwords></svg>
  }
  @case ('activity') {
    <svg class="h-full w-full" lucideActivity></svg>
  }
  @case ('shield') {
    <svg class="h-full w-full" lucideShield></svg>
  }
  @case ('trending-up') {
    <svg class="h-full w-full" lucideTrendingUp></svg>
  }
  @case ('calendar') {
    <svg class="h-full w-full" lucideCalendar></svg>
  }
  @default {
    <svg class="h-full w-full" lucideTarget></svg>
  }
}
