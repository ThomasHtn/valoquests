<!-- Pagination -->
<div class="flex items-center justify-center gap-3">
  <button
    (click)="goToPreviousPage()"
    [disabled]="page() === 0"
    [attr.aria-label]="previousLabel()"
    class="focus-ring flex h-10 w-10 shrink-0 cursor-pointer items-center justify-center rounded-full border border-surface-700 text-text-secondary transition-[background-color,color,scale] hover:bg-surface-800 hover:text-text-primary disabled:pointer-events-none disabled:opacity-40 motion-safe:active:scale-[0.96]"
    type="button"
  >
    <svg class="h-4 w-4" lucideChevronLeft></svg>
  </button>
  <span
    class="rounded-full border border-surface-700 bg-surface-900 px-4 py-1.5 text-sm font-bold tabular-nums text-text-primary"
    >{{ pageLabel() }}</span
  >
  <button
    (click)="goToNextPage()"
    [disabled]="page() >= totalPages() - 1"
    [attr.aria-label]="nextLabel()"
    class="focus-ring flex h-10 w-10 shrink-0 cursor-pointer items-center justify-center rounded-full border border-surface-700 text-text-secondary transition-[background-color,color,scale] hover:bg-surface-800 hover:text-text-primary disabled:pointer-events-none disabled:opacity-40 motion-safe:active:scale-[0.96]"
    type="button"
  >
    <svg class="h-4 w-4" lucideChevronRight></svg>
  </button>
</div>
