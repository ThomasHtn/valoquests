<!-- Header band. Denser than the body it caps, closed by a rule, and opened by a hexagonal marker in
     the brand colour: the same plate the challenge tiers and the boss card already wear, so a block's
     header reads as part of the same instrument family rather than as a heading with a line after it. -->
<div
  class="flex min-h-11 shrink-0 items-center gap-2.5 border-b border-edge bg-text-primary/4 px-3.5 py-2"
>
  <span
    aria-hidden="true"
    class="clip-hex grid h-4 w-3.5 shrink-0 place-items-center bg-brand-500/70"
  ></span>

  <h2 class="label-caption min-w-0 flex-1 truncate text-text-primary">{{ heading() }}</h2>

  <!-- Whatever the block closes its header with: a link to its own page, a filter, a count. -->
  <ng-content select="[hudAction]" />
</div>

<div [class]="bodyClass()">
  <ng-content />
</div>
