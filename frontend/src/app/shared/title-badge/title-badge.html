@let look = visual();
<span
  [appTooltip]="hint()"
  [attr.tabindex]="inLink() ? null : 0"
  [class]="'title-badge--' + size()"
  [style.--tone]="look.tone"
  class="title-badge focus-ring"
>
  <svg aria-hidden="true" class="title-badge__icon" [lucideIcon]="icons[look.icon]"></svg>
  <span class="title-badge__label">{{ 'common.title.' + title() | translate }}</span>
</span>
