<!-- Tooltip on the words, focusable only when it has something to show. -->
<p class="stat-tile__label label-caption">
  <span
    [appTooltipDisabled]="!tooltip()"
    [appTooltip]="tooltip()"
    [attr.tabindex]="tooltip() ? 0 : null"
    [class.stat-tile__term--hinted]="tooltip()"
    class="focus-ring"
    >{{ label() }}</span
  >
</p>
<p [style.--tone]="tone()" class="stat-tile__value">
  {{ value() }}
</p>
