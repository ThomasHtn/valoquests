@if (src(); as portraitUrl) {
  <img
    [class]="sizeClass()"
    [class.avatar--champion]="champion()"
    [height]="pixels()"
    [ngSrc]="portraitUrl"
    [priority]="priority()"
    [width]="pixels()"
    alt=""
    class="avatar avatar--portrait"
  />
} @else {
  <span [class]="sizeClass()" [class.avatar--champion]="champion()" class="avatar avatar--fallback">
    <svg class="avatar__icon" lucideUser></svg>
  </span>
}
