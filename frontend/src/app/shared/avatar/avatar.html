<!-- Portrait -->
@if (src(); as portraitUrl) {
  <img
    [class]="frameClass()"
    [class.ring-2]="champion()"
    [class.ring-accent-gold]="champion()"
    [height]="metrics().pixels"
    [ngSrc]="portraitUrl"
    [priority]="priority()"
    [width]="metrics().pixels"
    alt=""
    class="shrink-0 object-cover"
  />
} @else {
  <!-- Fallback -->
  <span
    [class]="frameClass()"
    [class.ring-2]="champion()"
    [class.ring-accent-gold]="champion()"
    class="flex shrink-0 items-center justify-center bg-surface-700 text-text-secondary"
  >
    <svg [class]="metrics().iconClass" lucideUser></svg>
  </span>
}
