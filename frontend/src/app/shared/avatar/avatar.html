<!-- Portrait -->
@if (src(); as portraitUrl) {
  <img [class]="sizeClasses().container" [src]="portraitUrl" alt="" class="shrink-0 object-cover" />
} @else {
  <!-- Fallback -->
  <span
    [class]="sizeClasses().container"
    class="flex shrink-0 items-center justify-center bg-surface-700 text-text-secondary"
  >
    <svg [class]="sizeClasses().icon" lucideUser></svg>
  </span>
}
