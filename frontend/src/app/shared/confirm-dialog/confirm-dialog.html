@if (open()) {
  <!-- Decorative scrim: the cancel button and Escape also dismiss. -->
  <div
    (click)="onScrimClick()"
    animate.enter="fx-scrim-in"
    animate.leave="fx-scrim-out"
    aria-hidden="true"
    class="confirm-dialog__scrim"
  ></div>

  <!-- Focused only to trap focus. -->
  <div
    #panel
    appFocusTrap
    animate.enter="fx-modal-in"
    animate.leave="fx-modal-out"
    [attr.aria-label]="heading()"
    aria-modal="true"
    class="confirm-dialog__panel notch-tr notch-tr-edge"
    role="dialog"
    tabindex="-1"
  >
    <h2 class="confirm-dialog__heading">{{ heading() }}</h2>

    <p class="confirm-dialog__body">{{ body() }}</p>

    @if (confirmationPhrase()) {
      <app-text-field [label]="confirmationHint()" class="mt-5">
        <input
          appTextFieldInput
          (input)="onPhraseInput($event)"
          [disabled]="busy()"
          [value]="typedPhrase()"
          autocapitalize="off"
          autocomplete="off"
          autocorrect="off"
          spellcheck="false"
          type="text"
        />
      </app-text-field>
    }

    <div class="mt-6 flex flex-wrap justify-end gap-3">
      <button
        appButton="ghost"
        (click)="dismissed.emit()"
        [disabled]="busy()"
        class="confirm-dialog__action"
        type="button"
      >
        {{ cancelLabel() }}
      </button>

      <button
        appButton="danger"
        (click)="confirmed.emit()"
        [disabled]="!canConfirm()"
        class="confirm-dialog__action confirm-dialog__action--confirm"
        type="button"
      >
        @if (busy()) {
          <app-spinner />
        }
        {{ confirmLabel() }}
      </button>
    </div>
  </div>
}
