@if (open()) {
  <!-- Scrim. Decorative: the dialog is dismissed from its own button and from Escape too, so this
       is a convenience rather than the only way out. -->
  <div
    (click)="busy() ? null : dismissed.emit()"
    aria-hidden="true"
    class="fixed inset-0 z-50 bg-surface-950/80"
  ></div>

  <!-- Panel. Outer notch is 0.875rem, matching the cards this dialog is opened from; the inner
       surfaces below step down to 0.5rem so nested corners stay concentric rather than pinched. -->
  <div
    #panel
    [attr.aria-label]="heading()"
    aria-modal="true"
    class="notch-tr notch-tr-edge focus-ring fixed top-1/2 left-1/2 z-50 w-[min(32rem,calc(100vw-2rem))] -translate-x-1/2 -translate-y-1/2 border border-brand-500/40 bg-surface-panel p-6 [--notch:0.875rem]"
    role="dialog"
    tabindex="-1"
  >
    <h2 class="tracking-label font-display text-lg font-bold text-text-primary uppercase">
      {{ heading() }}
    </h2>

    <p class="mt-3 text-prose text-pretty text-text-secondary">{{ body() }}</p>

    @if (confirmationPhrase()) {
      <label class="mt-5 block">
        <span class="tracking-label block font-mono text-2xs text-text-muted uppercase">
          {{ confirmationHint() }}
        </span>
        <!-- The border lives as a `background-color` on this wrapping `div`, one `--notch` cut
             behind an inner `div` cut to the same shape but inset by its `p-px` padding: the sliver
             of the outer shape left showing around the inner one is the "border". A replaced
             element like `<input>` never renders `::after`, and a plain rotated line drawn to meet
             the clip-path's cut edge left a hairline gap at the tip (two independently
             anti-aliased shapes trying to land on the same pixel); two nested clip-paths of the
             same polygon never have that seam. -->
        <div
          class="notch-tr mt-2 h-11 bg-text-muted p-px transition-colors [--notch:0.5rem] hover:bg-text-muted/80 focus-within:bg-brand-500 has-[:disabled]:opacity-60"
        >
          <div class="notch-tr h-full bg-surface-sunken [--notch:0.5rem]">
            <input
              (input)="onPhraseInput($event)"
              [disabled]="busy()"
              [value]="typedPhrase()"
              autocapitalize="off"
              autocomplete="off"
              autocorrect="off"
              class="h-full w-full bg-transparent px-3 font-mono text-sm text-text-primary placeholder:text-text-muted focus:outline-none"
              spellcheck="false"
              type="text"
            />
          </div>
        </div>
      </label>
    }

    <div class="mt-6 flex flex-wrap justify-end gap-3">
      <button
        appButton="ghost"
        (click)="dismissed.emit()"
        [disabled]="busy()"
        class="flex min-h-10 items-center px-4 py-2 text-sm font-semibold [--notch:0.5rem]"
        type="button"
      >
        {{ cancelLabel() }}
      </button>

      <button
        appButton="danger"
        (click)="confirmed.emit()"
        [disabled]="!canConfirm()"
        class="flex min-h-10 items-center gap-2 px-4 py-2 text-sm font-medium [--notch:0.5rem]"
        type="button"
      >
        {{ confirmLabel() }}
      </button>
    </div>
  </div>
}
