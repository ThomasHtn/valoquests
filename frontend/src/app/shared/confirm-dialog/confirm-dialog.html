@if (open()) {
  <!-- Scrim. Decorative: the dialog is dismissed from its own button and from Escape too, so this
       is a convenience rather than the only way out. -->
  <div
    (click)="busy() ? null : dismissed.emit()"
    aria-hidden="true"
    class="fixed inset-0 z-50 bg-surface-950/80"
  ></div>

  <!-- Panel. Outer notch is 0.875rem, matching the cards this dialog is opened from; the inner
       surfaces below step down to 0.5rem so nested corners stay concentric rather than pinched. -->
  <div
    #panel
    [attr.aria-label]="heading()"
    aria-modal="true"
    class="notch-tr notch-tr-edge focus-ring fixed top-1/2 left-1/2 z-50 w-[min(32rem,calc(100vw-2rem))] -translate-x-1/2 -translate-y-1/2 border border-brand-500/40 bg-surface-sunken p-6 [--notch:0.875rem]"
    role="dialog"
    tabindex="-1"
  >
    <h2 class="tracking-label font-display text-lg font-bold text-text-primary uppercase">
      {{ heading() }}
    </h2>

    <p class="mt-3 text-prose text-pretty text-text-secondary">{{ body() }}</p>

    @if (confirmationPhrase()) {
      <app-text-field [label]="confirmationHint()" class="mt-5">
        <input
          appTextFieldInput
          (input)="onPhraseInput($event)"
          [disabled]="busy()"
          [value]="typedPhrase()"
          autocapitalize="off"
          autocomplete="off"
          autocorrect="off"
          spellcheck="false"
          type="text"
        />
      </app-text-field>
    }

    <div class="mt-6 flex flex-wrap justify-end gap-3">
      <button
        appButton="ghost"
        (click)="dismissed.emit()"
        [disabled]="busy()"
        class="flex min-h-10 items-center px-4 py-2 text-sm font-semibold [--notch:0.5rem]"
        type="button"
      >
        {{ cancelLabel() }}
      </button>

      <button
        appButton="danger"
        (click)="confirmed.emit()"
        [disabled]="!canConfirm()"
        class="flex min-h-10 items-center justify-center gap-2 px-4 py-2 text-sm font-medium [--notch:0.5rem]"
        type="button"
      >
        @if (busy()) {
          <svg
            aria-hidden="true"
            class="h-4 w-4 shrink-0 motion-safe:animate-spin"
            lucideLoaderCircle
          ></svg>
        }
        {{ confirmLabel() }}
      </button>
    </div>
  </div>
}
