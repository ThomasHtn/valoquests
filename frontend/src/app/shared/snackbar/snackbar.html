<!-- Present from the start: screen readers often miss a region created with its text. -->
<div aria-live="polite" class="sr-only" role="status">{{ politeText() }}</div>
<div aria-live="assertive" class="sr-only" role="alert">{{ assertiveText() }}</div>

@if (snackbar.current(); as message) {
  <div animate.leave="fx-snack-out" class="snackbar__dock">
    <!-- Keyed by id so animations restart when the same text is queued twice. -->
    @for (item of [message]; track item.id) {
      <!-- Paused while hovered or focused. -->
      <div
        (focusin)="snackbar.pause()"
        (focusout)="snackbar.resume()"
        (mouseenter)="snackbar.pause()"
        (mouseleave)="snackbar.resume()"
        [class]="'snackbar__card--' + item.type"
        class="snackbar__card notch-tr notch-tr-edge fx-snack-in"
      >
        <p class="snackbar__message">
          @if (item.type === 'error') {
            <svg aria-hidden="true" class="snackbar__icon" lucideTriangleAlert></svg>
          } @else {
            <svg aria-hidden="true" class="snackbar__icon" lucideCircleCheck></svg>
          }
          <span class="snackbar__text">{{ item.text }}</span>
        </p>

        <button
          (click)="snackbar.dismiss()"
          [attr.aria-label]="'snackbar.dismiss' | translate"
          class="snackbar__close focus-ring"
          type="button"
        >
          <svg aria-hidden="true" class="size-3.5" lucideX></svg>
        </button>

        <!-- Inline duration: it must match the snackbar duration exactly. -->
        <div [style.animation-duration.ms]="timebarDurationMs()" class="snackbar__timebar"></div>
      </div>
    }
  </div>
}
