<!-- Same surface as the Chart.js tooltips elsewhere on the page: sunken ground, amber hairline. -->
@if (placement(); as place) {
  <div
    [style.left.px]="place.left"
    [style.top.px]="place.top"
    [style.transform]="place.transform"
    class="pointer-events-none absolute z-10 flex w-max max-w-68 min-w-52 flex-col gap-2.5 border border-brand-500/50 bg-surface-sunken px-3.5 py-3 text-text-primary"
    role="status"
  >
    <ng-content />
  </div>
}
