<span [attr.aria-label]="label() || null" class="countdown__timer" role="timer">
  <span aria-hidden="true" class="countdown__beat"></span>
  @for (unit of units(); track unit.key) {
    <span [class.countdown__unit--seconds]="unit.key === 'seconds'" class="countdown__unit">
      <b class="countdown__value">{{ unit.value }}</b>
      <small class="countdown__suffix">{{
        'common.countdown.units.' + unit.key | translate
      }}</small>
    </span>
  }
</span>
