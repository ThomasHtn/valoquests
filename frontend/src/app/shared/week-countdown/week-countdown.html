@if (remainingText(); as text) {
  <svg aria-hidden="true" class="week-countdown__icon" lucideHourglass></svg>

  <!-- Hidden below `md` for lack of room; the hourglass and the accessible name cover it. -->
  <span class="week-countdown__label label-caption">{{ timeLabel() }}</span>

  <span [attr.aria-label]="timeLabel() + ' ' + text" class="week-countdown__value">
    {{ text }}
  </span>
}
