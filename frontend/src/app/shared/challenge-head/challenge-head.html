@let row = this.row();
@let gain = this.gain();

<span aria-hidden="true" class="challenge-head__hex hex-mark clip-hex">
  <span class="challenge-head__mark clip-hex">
    @if (row.mark === 'D') {
      <svg class="challenge-head__glyph" [lucideIcon]="concepts.points"></svg>
    } @else {
      {{ row.mark }}
    }
  </span>
</span>

<!-- Paragraphs, not a heading: a table row header cannot hold one. -->
<div class="challenge-head__title">
  <p class="challenge-head__key-line">
    <span class="challenge-head__kind label-caption">{{ row.kind }}</span>
    @if (row.daily && row.closesAt === null) {
      <span class="challenge-head__closed">{{ 'challenges.daily.closedDay' | translate }}</span>
    }
  </p>
  <p class="challenge-head__name">{{ row.name }}</p>
</div>

<p class="challenge-head__gain">
  <!-- Icon and figure share one tooltip, on the line's baseline. -->
  <span
    [appTooltip]="gain.tooltipKey | translate: { count: gain.count }"
    class="challenge-head__gain-figure focus-ring"
    tabindex="0"
  >
    <svg aria-hidden="true" class="challenge-head__gain-icon" [lucideIcon]="gain.icon"></svg>
    <b class="challenge-head__gain-value">+{{ gain.count | figure }}</b>
  </span>
</p>

<p class="challenge-head__description">{{ row.description }}</p>
