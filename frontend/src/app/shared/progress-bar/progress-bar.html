<!-- Fill -->
<div [class]="colorClass()" [style.width.%]="percentage()" class="h-full"></div>

<!-- Leading-edge marker, pulled fully inside the fill by `-ml-0.5` so it stays visible when the
     track is full. Skipped at 0 %, where it would otherwise sit on an empty track and read as a
     value of its own. -->
@if (edgeMarker() && percentage() > 0) {
  <span
    [style.left.%]="percentage()"
    class="absolute inset-y-0 -ml-0.5 w-0.5 bg-text-primary"
  ></span>
}
