<!-- Fill; every moving part shares one transition so a refresh glides instead of snapping. -->
<div
  [style.--tone]="tone()"
  [style.width.%]="percentage()"
  class="progress-bar__fill fx-grow"
></div>

<!-- Leading-edge marker inside the fill. -->
@if (showsEdgeMarker()) {
  <span [style.left.%]="percentage()" class="progress-bar__edge fx-edge"></span>
}
