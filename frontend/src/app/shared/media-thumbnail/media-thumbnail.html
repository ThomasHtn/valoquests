@if (src(); as imageUrl) {
  <!-- `fill` lets a 16:9 map splash crop to the square without tripping the directive's ratio check. -->
  <span
    [attr.aria-hidden]="decorative() || null"
    [class.notch-tr]="notched()"
    class="media-thumbnail media-thumbnail--image"
  >
    <img [alt]="accessibleName() ?? ''" [ngSrc]="imageUrl" class="media-thumbnail__image" fill />
  </span>
} @else {
  <span
    [attr.aria-hidden]="decorative() || null"
    [class.notch-tr]="notched()"
    class="media-thumbnail media-thumbnail--monogram"
  >
    {{ monogram() }}
  </span>
  @if (accessibleName(); as name) {
    <span class="sr-only">{{ name }}</span>
  }
}
