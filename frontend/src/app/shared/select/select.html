<!-- Trigger -->
<button
  #trigger
  (click)="toggle()"
  [attr.aria-activedescendant]="activeOptionId()"
  [attr.aria-controls]="listboxId"
  [attr.aria-expanded]="isOpen()"
  [attr.aria-label]="ariaLabel()"
  [disabled]="disabled()"
  aria-haspopup="listbox"
  class="notch-tr focus-ring-inset flex min-h-10 cursor-pointer items-center gap-1.5 px-3 py-2 text-sm font-semibold text-text-primary transition-colors [--notch:0.5rem] hover:bg-brand-500/8 motion-safe:active:scale-[0.96] disabled:pointer-events-none disabled:opacity-40 sm:gap-2 sm:px-4"
  role="combobox"
  type="button"
>
  <ng-content select="[icon]" />
  <!-- Held out of the DOM rather than left empty when nothing is selected: an empty span still
       takes one of the trigger's gaps, which reads as stray padding on an icon-only trigger. -->
  @if (selectedLabel(); as label) {
    <span>{{ label }}</span>
    <svg
      [class.rotate-180]="isOpen()"
      class="h-4 w-4 shrink-0 text-text-secondary transition-transform duration-200 motion-reduce:transition-none"
      lucideChevronDown
    ></svg>
  } @else {
    <!-- Icon-only trigger, nothing selected yet: a chevron promises "this shows a value, click to
         change it", which is wrong here since there is no value to show. The vertical-dots mark
         reads as "more options" instead, which is what this trigger actually is. -->
    <svg class="h-4 w-4 shrink-0 text-text-secondary" lucideEllipsisVertical></svg>
  }
</button>

<!-- Options panel. Kept in the DOM while closed so `aria-controls` always resolves. Options are
     rendered as buttons for native click/activation semantics but held out of the tab order with
     tabindex="-1", since focus stays on the combobox and moves through `aria-activedescendant`.

     The panel's surface comes from the `menu-panel` utility, shared with the navigation's language
     listbox and the profile's overflow menu. Scrolling lives on the inner wrapper rather than this
     element: `overflow-y-auto` forces clipping on both axes, which would cut off the sliver
     `notch-tr-edge` draws just outside the border box to redraw the diagonal corner. -->
<div
  #panel
  [attr.aria-label]="ariaLabel()"
  [hidden]="!isOpen()"
  [id]="listboxId"
  [style.top.px]="panelPosition().top"
  [style.right.px]="panelPosition().right"
  [style.min-width.px]="panelPosition().minWidth"
  class="menu-panel fixed z-20"
  role="listbox"
>
  <!-- Capped in height and scrolled beyond it, so a long list (every game mode, every season)
       stays inside the viewport instead of running off the bottom of the page. Plain
       `overflow-y-auto` rather than `scroll-subtle`: its `scrollbar-gutter: stable` reserves the
       thumb's column even on a list short enough to never scroll, which reads as a stray margin. -->
  <div class="max-h-96 overflow-y-auto">
    @if (emptyText() && options().length <= 1) {
      <p class="px-4 py-2.5 text-base whitespace-nowrap text-text-secondary">{{ emptyText() }}</p>
    } @else {
      @for (option of options(); track $index) {
        <!-- The current value keeps a brand tint of its own, on top of the highlight the keyboard
             and the pointer both move around: a listbox whose only mark is the highlight leaves a
             reader who opens it and moves the mouse with nothing saying which option is in force. -->
        <button
          (click)="select(option)"
          [attr.aria-selected]="$index === selectedIndex()"
          [class.bg-brand-500/8]="$index === activeIndex()"
          [class.text-brand-500]="$index === selectedIndex()"
          [id]="optionId($index)"
          class="menu-option block text-text-secondary hover:bg-brand-500/8 hover:text-text-primary"
          role="option"
          tabindex="-1"
          type="button"
        >
          {{ option.label }}
        </button>
      }
    }
  </div>
</div>
