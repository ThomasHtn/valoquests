<!-- Trigger -->
<button
  #trigger
  (click)="toggle()"
  [attr.aria-expanded]="isOpen()"
  [attr.aria-label]="ariaLabel()"
  aria-haspopup="true"
  class="flex items-center gap-2 rounded-full border border-surface-700 bg-surface-900 px-4 py-2 text-sm font-semibold text-text-primary transition-colors hover:bg-surface-800"
  type="button"
>
  <ng-content select="[icon]" />
  <span>{{ selectedLabel() }}</span>
  <svg
    [class.rotate-180]="isOpen()"
    class="h-4 w-4 shrink-0 text-text-secondary transition-transform duration-200 motion-reduce:transition-none"
    lucideChevronDown
  ></svg>
</button>

@if (isOpen()) {
  <!-- Options panel -->
  <div
    class="absolute top-full left-0 z-10 mt-2 min-w-full overflow-hidden rounded-lg border border-surface-700 bg-surface-900 py-1 shadow-lg"
    role="menu"
  >
    @for (option of options(); track $index) {
      <button
        (click)="select(option)"
        [class.bg-surface-800]="option.value === value()"
        class="block w-full cursor-pointer px-4 py-2 text-left text-sm whitespace-nowrap text-text-primary transition-colors hover:bg-surface-800"
        role="menuitem"
        type="button"
      >
        {{ option.label }}
      </button>
    }
  </div>
}
