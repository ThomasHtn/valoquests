<button
  #trigger
  (click)="toggle()"
  [attr.aria-activedescendant]="activeOptionId()"
  [attr.aria-controls]="listboxId"
  [attr.aria-expanded]="isOpen()"
  [attr.aria-label]="ariaLabel()"
  [disabled]="disabled()"
  aria-haspopup="listbox"
  class="select__trigger notch-tr focus-ring-inset press"
  role="combobox"
  type="button"
>
  <ng-content select="[icon]" />
  <!-- No empty span: it would still take a gap on an icon-only trigger. -->
  @if (selectedLabel(); as label) {
    <span>{{ label }}</span>
    <svg
      [class.select__chevron--open]="isOpen()"
      class="select__icon select__chevron"
      lucideChevronDown
    ></svg>
  } @else {
    <!-- Nothing selected: dots read as "more options", a chevron would promise a value. -->
    <svg class="select__icon" lucideEllipsisVertical></svg>
  }
</button>

<!-- Kept in the DOM while closed so `aria-controls` resolves; options skip the tab order. -->
<!-- Scroll on the inner wrapper: clipping here would cut the notch drawn outside the box. -->
<div
  #panel
  [attr.aria-label]="ariaLabel()"
  [hidden]="!isOpen()"
  [id]="listboxId"
  [style.top.px]="panelPosition().top"
  [style.bottom.px]="panelPosition().bottom"
  [style.right.px]="panelPosition().right"
  [style.min-width.px]="panelPosition().minWidth"
  class="menu-panel fixed z-20"
  role="listbox"
>
  <!-- Capped in height so a long list stays inside the viewport. -->
  <div [style.max-height.px]="panelPosition().maxHeight" class="menu-scroll">
    @if (emptyText() && options().length <= 1) {
      <p class="select__empty">{{ emptyText() }}</p>
    } @else {
      @for (option of options(); track $index) {
        <!-- The current value keeps its own tint, distinct from the moving highlight. -->
        <button
          (click)="select(option)"
          [attr.aria-selected]="$index === selectedIndex()"
          [attr.data-active]="$index === activeIndex() || null"
          [id]="optionId($index)"
          class="menu-option listbox-option block"
          role="option"
          tabindex="-1"
          type="button"
        >
          {{ option.label }}
        </button>
      }
    }
  </div>
</div>
