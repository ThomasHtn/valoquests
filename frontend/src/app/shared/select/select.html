<!-- Trigger -->
<button
  #trigger
  (click)="toggle()"
  [attr.aria-activedescendant]="activeOptionId()"
  [attr.aria-controls]="listboxId"
  [attr.aria-expanded]="isOpen()"
  [attr.aria-label]="ariaLabel()"
  aria-haspopup="listbox"
  class="focus-ring flex min-h-10 cursor-pointer items-center gap-2 rounded-full border border-surface-700 bg-surface-900 px-4 py-2 text-sm font-semibold text-text-primary transition-[background-color,scale] hover:bg-surface-800 motion-safe:active:scale-[0.96]"
  role="combobox"
  type="button"
>
  <ng-content select="[icon]" />
  <span>{{ selectedLabel() }}</span>
  <svg
    [class.rotate-180]="isOpen()"
    class="h-4 w-4 shrink-0 text-text-secondary transition-transform duration-200 motion-reduce:transition-none"
    lucideChevronDown
  ></svg>
</button>

<!-- Options panel. Kept in the DOM while closed so `aria-controls` always resolves. Options are
     rendered as buttons for native click/activation semantics but held out of the tab order with
     tabindex="-1", since focus stays on the combobox and moves through `aria-activedescendant`.
     Capped in height and scrolled beyond it, so a long list (every game mode, every season) stays
     inside the viewport instead of running off the bottom of the page. -->
<div
  [attr.aria-label]="ariaLabel()"
  [hidden]="!isOpen()"
  [id]="listboxId"
  class="absolute top-full left-0 z-20 mt-2 max-h-72 min-w-full overflow-y-auto rounded-lg border border-surface-700 bg-surface-900 py-1 shadow-lg"
  role="listbox"
>
  @for (option of options(); track $index) {
    <button
      (click)="select(option)"
      [attr.aria-selected]="$index === selectedIndex()"
      [class.bg-surface-800]="$index === activeIndex()"
      [id]="optionId($index)"
      class="block w-full cursor-pointer px-4 py-2 text-left text-sm whitespace-nowrap text-text-primary transition-[background-color,scale] hover:bg-surface-800 motion-safe:active:scale-[0.96]"
      role="option"
      tabindex="-1"
      type="button"
    >
      {{ option.label }}
    </button>
  }
</div>
