<!-- `end` overrides the user-agent margins and max-height to fill the trailing edge; `center`
     restores the `m-auto` centering the CSS reset removes. -->
<dialog
  #dialog
  (cancel)="onCancel($event)"
  (close)="closed.emit()"
  [attr.aria-labelledby]="labelledBy()"
  [class]="
    anchor() === 'center'
      ? 'm-auto max-h-[85dvh] w-[calc(100%-2rem)] max-w-2xl border border-brand-500/30 ' +
        (closing() ? 'fx-modal-out' : 'fx-modal-in')
      : 'm-0 ml-auto h-dvh max-h-dvh w-full max-w-md border-l border-brand-500/30 ' +
        (closing() ? 'fx-sheet-out' : 'fx-sheet-in')
  "
  [class.drawer--closing]="closing()"
  class="drawer bg-surface-sunken p-0 text-text-primary backdrop:bg-surface-sunken/75"
>
  <div
    class="flex h-full flex-col gap-6 overflow-y-auto p-5 pb-[max(1.25rem,env(safe-area-inset-bottom))] sm:p-7 sm:pb-[max(1.75rem,env(safe-area-inset-bottom))]"
  >
    <!-- `justify-between`, not an auto margin, so a long title stops short of the button. -->
    <div class="flex items-center justify-between gap-2">
      <ng-content select="[drawerLeading]" />

      <button
        (click)="close()"
        [attr.aria-label]="closeLabel()"
        class="focus-ring-inset flex size-11 shrink-0 cursor-pointer items-center justify-center border border-edge text-text-secondary transition-colors hover:bg-text-primary/10 hover:text-text-primary"
        type="button"
      >
        <svg aria-hidden="true" class="size-4" lucideX></svg>
      </button>
    </div>

    <ng-content />
  </div>
</dialog>
