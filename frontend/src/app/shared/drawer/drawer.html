<dialog
  #dialog
  (cancel)="onCancel($event)"
  (close)="closed.emit()"
  [attr.aria-labelledby]="labelledBy()"
  [class]="dialogClass()"
  [class.drawer--closing]="closing()"
  class="drawer"
>
  <div class="drawer__body">
    <!-- `justify-between`, not an auto margin, so a long title stops short of the button. -->
    <div class="flex items-center justify-between gap-2">
      <ng-content select="[drawerLeading]" />

      <button
        (click)="close()"
        [attr.aria-label]="closeLabel()"
        class="drawer__close focus-ring-inset"
        type="button"
      >
        <svg aria-hidden="true" class="size-4" lucideX></svg>
      </button>
    </div>

    <ng-content />
  </div>
</dialog>
