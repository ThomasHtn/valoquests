<!-- On a phone the hairline and diamond sit on the title's last line (0.9375rem = half a line);
     the link and `wrapSide` content take the next line. -->
<div class="mb-6 flex flex-wrap items-center gap-x-4 gap-y-2">
  <h2
    #title
    [class]="keepsLine() ? 'max-sm:max-w-[calc(100%-3.5rem)]' : ''"
    [id]="headingId()"
    class="font-display min-w-0 text-[clamp(1.5rem,1.1rem+1.1vw,2rem)] leading-tight font-semibold tracking-[0.01em] text-brand-400 uppercase"
  >
    {{ heading() }}
  </h2>
  <span
    [class]="
      keepsLine()
        ? 'block max-sm:mb-[calc(0.9375rem-0.5px)] max-sm:basis-4 max-sm:self-end'
        : 'hidden sm:block'
    "
    aria-hidden="true"
    class="h-px flex-[1_1_3rem] bg-linear-to-r from-brand-500/50 to-transparent"
  ></span>
  <span
    [class]="
      dissolves()
        ? 'max-sm:contents'
        : side()
          ? ''
          : 'max-sm:mb-[calc(0.9375rem-4px)] max-sm:self-end'
    "
    class="ml-auto flex min-w-0 max-w-full flex-wrap items-center justify-end gap-x-4 gap-y-1"
  >
    @if (side(); as caption) {
      <span
        class="label-caption min-w-0 text-2xs leading-snug text-text-muted max-sm:basis-full sm:text-right"
        >{{ caption }}</span
      >
    }
    <!-- Richer side content, such as the week's days. -->
    <ng-content />
    @if (link(); as route) {
      <a
        [fragment]="linkFragment()"
        [routerLink]="route"
        class="focus-ring tracking-label font-mono text-xs font-medium text-brand-400 uppercase transition-colors hover:text-brand-300 hover:underline hover:underline-offset-4 max-sm:order-last max-sm:-mt-1.5 max-sm:basis-full max-sm:text-right"
      >
        {{ linkLabel() }}
      </a>
    }
    <!-- Hidden on a phone beside a lone caption, where it would sit alone on a line. -->
    <span
      [class]="
        side() && !link()
          ? 'max-sm:hidden'
          : dissolves()
            ? 'max-sm:mb-[calc(0.9375rem-4px)] max-sm:self-end'
            : ''
      "
      aria-hidden="true"
      class="size-2 rotate-45 border border-brand-500/70"
    ></span>
  </span>
</div>
