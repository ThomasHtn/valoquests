<!-- On a phone the hairline and diamond sit on the title's last line (0.9375rem = half a line). -->
<div class="mb-6 flex flex-wrap items-center gap-x-4 gap-y-2">
  <h2 #title [id]="headingId()" class="section-rule__title">{{ heading() }}</h2>
  <span aria-hidden="true" class="section-rule__line"></span>
  <span aria-hidden="true" class="section-rule__diamond"></span>
</div>
