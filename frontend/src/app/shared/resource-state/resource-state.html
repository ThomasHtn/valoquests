@if (isLoading()) {
  <!-- Loading state. The projected skeleton mirrors the loaded layout so arriving data does not
       shift the page; the status text carries the same information non-visually. -->
  <div aria-busy="true">
    <ng-content select="[skeleton]" />
    <p class="sr-only" role="status">{{ loadingText() }}</p>
  </div>
} @else if (isError()) {
  <!-- Error state, with the retry affordance the backing resource exposes through `reload()`. -->
  <div [class]="padding()" class="flex flex-col items-center gap-3 text-center" role="alert">
    <span
      class="clip-hex flex h-12 w-11 shrink-0 items-center justify-center bg-danger/15 text-danger"
    >
      <svg class="h-5 w-5" lucideTriangleAlert></svg>
    </span>
    <p class="text-prose font-semibold text-text-primary">{{ errorText() }}</p>
    <button
      appButton="accent"
      (click)="retry.emit()"
      class="flex min-h-10 items-center gap-2 px-4 py-2 text-sm font-semibold [--notch:0.5rem]"
      type="button"
    >
      <svg class="h-4 w-4 shrink-0" lucideRefreshCw></svg>
      {{ retryLabel() }}
    </button>
  </div>
} @else if (isEmpty()) {
  <!-- Empty state, in the shape its `emptyKind` calls for — see that input for why one shape did
       not fit twelve situations. `anomaly` is an alert, so it is announced; the other three are
       ordinary page content and are not. -->
  <div
    [attr.role]="emptyKind() === 'anomaly' ? 'alert' : null"
    [class]="padding()"
    class="flex flex-col items-center gap-3 text-center"
  >
    @if (emptyPlate(); as plate) {
      <app-empty-plate
        [plate]="plate"
        [tone]="emptyKind() === 'waiting' ? 'waiting' : 'creation'"
      />
    } @else {
      <span
        [class]="emptyGlyphClass()"
        class="clip-hex flex h-12 w-11 shrink-0 items-center justify-center"
      >
        @switch (emptyKind()) {
          @case ('waiting') {
            <svg class="h-5 w-5" lucideHourglass></svg>
          }
          @case ('creation') {
            <svg class="h-5 w-5" lucidePlus></svg>
          }
          @case ('anomaly') {
            <svg class="h-5 w-5" lucideTriangleAlert></svg>
          }
          @default {
            <svg class="h-5 w-5" lucideFilter></svg>
          }
        }
      </span>
      <p class="text-prose text-text-secondary">{{ emptyText() }}</p>
    }

    <!-- The way out of the empty state, projected by the caller: the filter to clear, the record to
         create, the operation to run. An empty screen is an invitation to act, and eleven of these
         used to end on a full stop. -->
    <ng-content select="[emptyAction]" />
  </div>
} @else {
  <ng-content />
}
