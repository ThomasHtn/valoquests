<span class="relative flex size-11 shrink-0 items-center justify-center">
  <app-progress-circle
    class="absolute inset-0 size-full"
    [colorClass]="cell().visual.iconClass"
    [percentage]="ringPercentage()"
  />
  @if (cell().completed) {
    <span [class]="cell().visual.badgeClass" class="progress-ring-core absolute"></span>
  }
  <span [class]="labelClasses()" class="relative font-mono font-bold tabular-nums">
    {{ displayLabel() }}
  </span>
  <span class="sr-only">
    {{ cell().categoryLabel }}:
    {{ cell().currentValueLabel }}
    @if (cell().targetValueLabel) {
      / {{ cell().targetValueLabel }}
    }
    @if (cell().completed) {
      — {{ 'overview.weeklyRanking.completed' | translate }}
    }
  </span>
</span>
