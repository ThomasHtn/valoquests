<div #wrap (scroll)="onScroll()" class="strip-wrap relative z-[1]">
  <ol [attr.aria-label]="'campaign.galaxy.strip' | translate" class="strip">
    @for (planet of planets(); track planet.index) {
      <li [class.seg--done]="planet.state === 'won' || planet.state === 'lost'">
        <button
          (click)="open(planet)"
          [attr.aria-expanded]="openedIndex() === planet.index"
          [class]="'pl pl--' + planet.state"
          [class.pl--final]="planet.final"
          aria-controls="planet-drawer"
          type="button"
        >
          <span class="pl-orbit">
            <app-planet-orb
              [advance]="planet.advance"
              [hue]="planet.hue"
              [radius]="planet.radius"
              [seed]="planet.index + 20"
              [state]="planet.state"
            />
          </span>
          <!-- The label plate: a translucent card so the text reads over the stars. -->
          <span class="pl-card">
            <span class="pl-no">{{ planet.label }}</span>
            <span class="pl-name">{{ planet.name }}</span>
            <span
              [class.text-boss-hp-edge]="planet.category === 'ELITE'"
              class="label-caption text-2xs text-text-muted"
              >{{ 'common.guardianCategory.' + planet.category | translate }}</span
            >
            <span class="pl-state">
              @switch (planet.stateIcon) {
                @case ('check') {
                  <svg aria-hidden="true" class="size-3.5" lucideCheck></svg>
                }
                @case ('x') {
                  <svg aria-hidden="true" class="size-3.5" lucideX></svg>
                }
                @case ('swords') {
                  <svg aria-hidden="true" class="size-3.5" lucideSwords></svg>
                }
                @case ('star') {
                  <svg aria-hidden="true" class="size-3.5" lucideStar></svg>
                }
              }
              {{ planet.stateLabel }}
            </span>
          </span>
        </button>
      </li>
    }
  </ol>
</div>

<!-- One planet per screen: the road between them is gone, so this rail carries the ten weeks and
     jumps to any of them. -->
@if (isSlider()) {
  <div class="rail-bar relative z-[1]">
    <button
      (click)="step(-1)"
      [attr.aria-label]="'campaign.galaxy.previous' | translate"
      [disabled]="openedPosition() <= 0"
      class="focus-ring rail-arrow"
      type="button"
    >
      <svg aria-hidden="true" class="size-4" lucideChevronLeft></svg>
    </button>

    <ol class="rail">
      @for (planet of planets(); track planet.index) {
        <li>
          <button
            (click)="goTo(planet)"
            [attr.aria-current]="openedIndex() === planet.index ? 'true' : null"
            [attr.aria-label]="planet.label + ' · ' + planet.name"
            [class]="'focus-ring tick tick--' + planet.state"
            aria-controls="planet-drawer"
            type="button"
          ></button>
        </li>
      }
    </ol>

    <button
      (click)="step(1)"
      [attr.aria-label]="'campaign.galaxy.next' | translate"
      [disabled]="openedPosition() >= planets().length - 1"
      class="focus-ring rail-arrow"
      type="button"
    >
      <svg aria-hidden="true" class="size-4" lucideChevronRight></svg>
    </button>
  </div>
}

<!-- The report of the opened planet, under the strip, pointing at it. -->
@if (opened(); as planet) {
  <app-planet-drawer [planet]="planet" [pointerX]="pointerX()" />
}
