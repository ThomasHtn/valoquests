<!-- Layers share one grid cell, leaving each `transform` free for its animation. -->
<button
  class="focus-ring relative grid h-[var(--compass-size)] w-[var(--compass-size)] cursor-pointer place-items-center rounded-full transition-transform duration-200 hover:scale-[1.03]"
  type="button"
  (click)="entered.emit()"
>
  <!-- Sonar rings, invisible at rest so reduced motion shows no frozen halos. -->
  <span
    aria-hidden="true"
    class="col-start-1 row-start-1 h-[calc(var(--compass-size)*0.62)] w-[calc(var(--compass-size)*0.62)] rounded-full border border-brand-500 opacity-0 motion-safe:animate-compass-ripple"
  ></span>
  <span
    aria-hidden="true"
    class="col-start-1 row-start-1 h-[calc(var(--compass-size)*0.62)] w-[calc(var(--compass-size)*0.62)] rounded-full border border-brand-500 opacity-0 [animation-delay:1.5s] motion-safe:animate-compass-ripple"
  ></span>

  <!-- Outer bezel and cardinal ticks, north in amber. -->
  <span
    aria-hidden="true"
    class="relative col-start-1 row-start-1 h-[var(--compass-size)] w-[var(--compass-size)] rounded-full border border-dashed border-brand-500/40 motion-safe:animate-compass-spin"
  >
    <span
      class="absolute top-1 left-[calc(50%-1px)] h-2.5 w-0.5 bg-brand-500 sm:top-1.5 sm:h-3"
    ></span>
    <span
      class="absolute bottom-1 left-[calc(50%-1px)] h-2.5 w-0.5 bg-text-primary/30 sm:bottom-1.5 sm:h-3"
    ></span>
    <span
      class="absolute top-[calc(50%-1px)] left-1 h-0.5 w-2.5 bg-text-primary/30 sm:left-1.5 sm:w-3"
    ></span>
    <span
      class="absolute top-[calc(50%-1px)] right-1 h-0.5 w-2.5 bg-text-primary/30 sm:right-1.5 sm:w-3"
    ></span>
  </span>

  <!-- Inner bezel, counter-rotating. -->
  <span
    aria-hidden="true"
    class="relative col-start-1 row-start-1 h-[calc(var(--compass-size)*0.8)] w-[calc(var(--compass-size)*0.8)] rounded-full border border-brand-500/55 motion-safe:animate-compass-spin-reverse"
  >
    <span
      class="absolute top-2.5 left-[calc(50%-3px)] h-1.5 w-1.5 rounded-full bg-brand-500 sm:top-3.5"
    ></span>
  </span>

  <!-- Core disc carrying the label. -->
  <span
    class="col-start-1 row-start-1 flex h-[calc(var(--compass-size)*0.62)] w-[calc(var(--compass-size)*0.62)] flex-col items-center justify-center gap-1.5 rounded-full border-2 border-brand-500 bg-radial from-brand-400 to-brand-500 text-surface-950 motion-safe:animate-compass-core"
  >
    <span class="tracking-label font-display text-sm/none font-bold uppercase sm:text-base">
      {{ 'landing.compass.action' | translate }}
    </span>
    <!-- Tighter than `tracking-label` to fit inside the disc on small viewports. -->
    <span class="font-mono text-2xs font-semibold tracking-wider uppercase">
      {{ 'landing.compass.caption' | translate }}
    </span>
  </span>
</button>
