<button (click)="entered.emit()" class="compass focus-ring" type="button">
  <!-- Sonar rings, out of the core. -->
  <span aria-hidden="true" class="compass__ripple motion-safe:animate-compass-ripple"></span>
  <span
    aria-hidden="true"
    class="compass__ripple compass__ripple--late motion-safe:animate-compass-ripple"
  ></span>

  <!-- Outer bezel and cardinal ticks. -->
  <span aria-hidden="true" class="compass__bezel motion-safe:animate-compass-spin">
    <span class="compass__tick compass__tick--north"></span>
    <span class="compass__tick compass__tick--south"></span>
    <span class="compass__tick compass__tick--west"></span>
    <span class="compass__tick compass__tick--east"></span>
  </span>

  <!-- Inner bezel, counter-rotating. -->
  <span aria-hidden="true" class="compass__inner-bezel motion-safe:animate-compass-spin-reverse">
    <span class="compass__marker"></span>
  </span>

  <!-- Core disc carrying the label. -->
  <span class="compass__core motion-safe:animate-compass-core">
    <span class="compass__action">{{ 'landing.compass.action' | translate }}</span>
    <span class="compass__caption">{{ 'landing.compass.caption' | translate }}</span>
  </span>
</button>
