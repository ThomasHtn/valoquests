<!-- `h-dvh` rather than `h-full`: this page renders straight under the root outlet, with no
     sized ancestor to inherit a height from. `dvh` tracks the mobile browser's dynamic toolbar
     instead of the larger static viewport, so the bottom of the page isn't hidden behind it.
     `overflow-y-auto` is the safety valve for viewports too short to hold the composition, which
     `body { overflow: hidden }` would otherwise trap. That valve only works with *safe* centering:
     plain `justify-center` overflows in both directions, pushing the heading past the top edge
     where no amount of scrolling reaches it. `safe center` falls back to `flex-start` as soon as
     the content stops fitting, which is exactly when the scrollbar appears. -->
<main
  class="justify-center-safe relative flex h-dvh flex-col items-center overflow-y-auto bg-surface-950 px-6 py-7 text-text-primary sm:px-20 sm:py-15"
>
  <div
    aria-hidden="true"
    class="landing-backdrop pointer-events-none absolute inset-0 opacity-50"
  ></div>

  <div class="relative flex max-w-[720px] flex-col items-center text-center">
    <p
      class="tracking-label bg-brand-500 px-2.5 py-1 font-mono text-2xs font-bold text-surface-950 uppercase"
    >
      @if (weekNumber(); as week) {
        {{ 'landing.weekLabel' | translate: { week: week } }}
      } @else {
        {{ 'landing.weekLabelPending' | translate }}
      }
    </p>

    <!-- The name is not translated and not a key: it is the wordmark, carrying the badge's own amber
         gradient (`brand-400` → `brand-500`, the two stops of the logo) through `bg-clip-text`. -->
    <h1 class="font-display mt-4 font-bold uppercase">
      <span class="block text-2xl/snug sm:text-4xl/snug">{{
        'landing.heading.welcome' | translate
      }}</span>
      <span
        class="mt-1 block bg-linear-to-br from-brand-400 to-brand-500 bg-clip-text text-4xl/snug text-transparent sm:mt-1.5 sm:text-6xl/snug"
        >ValoQuests</span
      >
    </h1>

    <!-- Keeps its own leading rather than the `text-prose` token: this is a centered hero line, set
         tighter than a paragraph of body copy, and it grows a step at `sm` where the composition
         has the room. -->
    <p class="mt-3.5 max-w-[540px] text-base/normal text-text-secondary sm:mt-5 sm:text-xl/normal">
      {{ 'landing.body' | translate }}
    </p>

    <!-- The chevron points down at the compass, hence the hint sitting above it. Its rotation is
         carried by an inner element so the nudge animation's own `transform` cannot overwrite it. -->
    <p class="mt-6 flex items-center justify-center gap-2 text-text-muted sm:mt-8">
      <span class="tracking-label font-mono text-2xs font-medium uppercase sm:text-xs/none">
        {{ 'landing.hint' | translate }}
      </span>
      <span aria-hidden="true" class="inline-block motion-safe:animate-hint-nudge">
        <span
          class="block h-2 w-2 rotate-45 border-r-2 border-b-2 border-current sm:h-2.5 sm:w-2.5"
        ></span>
      </span>
    </p>
  </div>

  <app-compass class="relative mt-6 sm:mt-8" (entered)="enter()" />
</main>
