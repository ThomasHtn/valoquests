<app-resource-state
  [emptyText]="'playerProfile.progression.empty' | translate"
  [errorText]="'playerProfile.progression.error' | translate"
  [isEmpty]="isEmpty()"
  [isError]="!!progressionResource.error()"
  [isLoading]="progressionResource.isLoading()"
  [loadingText]="'playerProfile.progression.loading' | translate"
  (retry)="progressionResource.reload()"
>
  <!-- Same silhouette as the loaded view so arriving sections do not shift the page. -->
  <div class="flex flex-col gap-6" skeleton>
    <div class="progression__skeleton-panel p-5">
      <span class="progression__skeleton-bar mb-4 block h-2.5 w-32"></span>
      <span
        class="progression__skeleton-bar progression__skeleton-bar--faint block h-56 w-full"
      ></span>
    </div>
    <div class="grid grid-cols-2 gap-2 sm:grid-cols-3 lg:grid-cols-5">
      @for (placeholder of skeletonRows; track $index) {
        <div class="progression__skeleton-tile px-4 py-3.5">
          <span class="progression__skeleton-bar mb-3 block h-2.5 w-14"></span>
          <span class="progression__skeleton-bar block h-5 w-12"></span>
        </div>
      }
    </div>
  </div>

  @if (progression(); as data) {
    <!-- Flat blocks on one tinted ground, not cards: the sections read as one report. -->
    <div class="flex flex-col gap-6">
      <section class="progression__section">
        <app-evolution-chart [evolution]="data.evolution" [seasonOrder]="seasonOrder()" />
      </section>

      <div class="progression__split grid gap-6">
        <section class="progression__section">
          <app-play-style [aim]="data.aim" />
        </section>

        <section class="progression__section">
          <app-schedule-performance [hourSlots]="data.hourSlots" [weekdays]="data.weekdays" />
        </section>
      </div>

      <section class="progression__section">
        <app-personal-records [records]="data.records" />
      </section>

      <div class="grid gap-6 lg:grid-cols-2">
        <section class="progression__section">
          <app-entity-stats
            [entityLabel]="'playerProfile.progression.maps.entity' | translate"
            [rows]="mapRows()"
            [titleTooltip]="'playerProfile.progression.maps.tooltip' | translate"
            [title]="'playerProfile.progression.maps.title' | translate"
          />
        </section>

        <section class="progression__section">
          <app-entity-stats
            [entityLabel]="'playerProfile.progression.agents.entity' | translate"
            [rows]="agentRows()"
            [titleTooltip]="'playerProfile.progression.agents.tooltip' | translate"
            [title]="'playerProfile.progression.agents.title' | translate"
          />
        </section>
      </div>

      <section class="progression__section">
        <app-rank-journey [journey]="data.rankJourney" />
      </section>

      <section class="progression__section">
        <app-consistency [consistency]="data.consistency" />
      </section>
    </div>
  }
</app-resource-state>
