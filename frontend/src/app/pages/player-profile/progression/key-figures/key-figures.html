<!-- One column on a phone, as many as fit above: four figures share a row on desktop. -->
<ul class="key-figures__list grid gap-x-6 gap-y-4 pt-4">
  @for (figure of figures(); track figure.caption) {
    <li class="key-figures__item flex min-w-0 items-center gap-3">
      @if (figure.rankIconUrl) {
        <img [ngSrc]="figure.rankIconUrl" alt="" class="size-10 shrink-0" height="40" width="40" />
      } @else {
        <span
          [class]="toneModifiers[figure.tone ?? 'brand']"
          aria-hidden="true"
          class="key-figures__icon"
        >
          <svg [lucideIcon]="icons[figure.icon ?? 'flat']" class="size-5"></svg>
        </span>
      }
      <span class="flex min-w-0 flex-col gap-1">
        <span class="key-figures__caption label-caption">{{ figure.caption }}</span>
        <span
          [class.key-figures__value--toned]="figure.valueTone"
          [style.--tone]="figure.valueTone"
          class="key-figures__value"
          >{{ figure.value }}</span
        >
        <span class="key-figures__detail">{{ figure.detail }}</span>
      </span>
    </li>
  }
</ul>
