<div class="flex h-full flex-col gap-6">
  <h3 class="schedule-performance__title label-caption">
    <span
      [appTooltip]="'playerProfile.progression.schedule.tooltip' | translate"
      class="focus-ring"
      tabindex="0"
      >{{ 'playerProfile.progression.schedule.title' | translate }}</span
    >
  </h3>

  <div class="grid gap-8 lg:grid-cols-2">
    @for (chart of charts(); track chart.titleKey) {
      <div class="flex flex-col gap-3">
        <p class="schedule-performance__chart-title label-caption">
          {{ chart.titleKey | translate }}
        </p>
        <app-bar-chart
          [ariaLabel]="chart.titleKey | translate"
          [bars]="chart.bars"
          [summary]="chart.summary"
          [xAxisLabel]="chart.xAxisKey | translate"
          [yAxisLabel]="'playerProfile.progression.schedule.axis.winRate' | translate"
          [valueFormatter]="formatRate"
        />
        <!-- The claim in words, since colour alone is not readable by everyone. -->
        @if (chart.best) {
          <p class="schedule-performance__best flex items-center gap-2">
            <span aria-hidden="true" class="schedule-performance__best-mark"></span>
            {{ chart.best }}
          </p>
        }
      </div>
    }
  </div>

  <!-- Sunk to the card's floor: it qualifies everything above it. -->
  <p class="schedule-performance__note">
    {{ 'playerProfile.progression.schedule.threshold' | translate: { count: minimumSample } }}
  </p>
</div>
