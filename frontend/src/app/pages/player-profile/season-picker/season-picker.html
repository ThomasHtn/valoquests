<!-- Same anatomy as the week picker; the arrows step one act, so only on a single act. -->
<button
  (click)="step(1)"
  [attr.aria-label]="'playerProfile.seasonPicker.previous' | translate"
  [disabled]="!canGoBack()"
  class="season-picker__step focus-ring-inset"
  type="button"
>
  <svg aria-hidden="true" class="size-4" lucideChevronLeft></svg>
</button>

<!-- Select-only combobox: focus stays here, `aria-activedescendant` points at the highlight. -->
<button
  #trigger
  (click)="toggle()"
  (keydown)="onKeydown($event)"
  [attr.aria-activedescendant]="activeOptionId()"
  [attr.aria-controls]="listboxId"
  [attr.aria-expanded]="isOpen()"
  [attr.aria-label]="ariaLabel()"
  aria-haspopup="listbox"
  class="season-picker__trigger notch-tr focus-ring-inset"
  role="combobox"
  type="button"
>
  @if (current(); as current) {
    @if (current.mark) {
      <span aria-hidden="true" class="season-picker__mark">{{ current.mark }}</span>
    }
    <span class="season-picker__trigger-label">{{ current.label }}</span>
    <span class="sr-only">{{ current.fullName }}</span>
  } @else {
    <span aria-hidden="true" class="season-picker__mark season-picker__mark--none">—</span>
    <span class="season-picker__trigger-label">{{ summary() }}</span>
  }
  <svg
    [class.season-picker__chevron--open]="isOpen()"
    aria-hidden="true"
    class="season-picker__chevron"
    lucideChevronDown
  ></svg>
</button>

<button
  (click)="step(-1)"
  [attr.aria-label]="'playerProfile.seasonPicker.next' | translate"
  [disabled]="!canGoForward()"
  class="season-picker__step focus-ring-inset"
  type="button"
>
  <svg aria-hidden="true" class="size-4" lucideChevronRight></svg>
</button>

<!-- Acts newest first, ruled off by episode; rows stay out of the tab order (`data-active`). -->
<div
  #panel
  (keydown)="onKeydown($event)"
  [attr.aria-label]="ariaLabel()"
  [attr.aria-multiselectable]="multiple() || null"
  [hidden]="!isOpen()"
  [id]="listboxId"
  class="season-picker__listbox menu-panel"
  role="listbox"
  tabindex="-1"
>
  <div class="season-picker__scroll">
    @if (!multiple()) {
      <button
        (click)="selectAll()"
        [attr.aria-selected]="selection().length === 0"
        [attr.data-active]="activeIndex() === 0 || null"
        [id]="optionId(0)"
        class="season-picker__option menu-option listbox-option focus-ring-inset"
        role="option"
        tabindex="-1"
        type="button"
      >
        <span aria-hidden="true" class="season-picker__mark season-picker__mark--none">—</span>
        <span class="season-picker__option-label">{{
          'playerProfile.filters.allSeasons' | translate
        }}</span>
        <span></span>
      </button>
      <hr aria-hidden="true" class="season-picker__divider" />
    }
    @for (option of options(); track option.id) {
      @if (startsGroup($index)) {
        <hr aria-hidden="true" class="season-picker__divider" />
      }
      <button
        (click)="select(option)"
        [attr.aria-label]="option.fullName"
        [attr.aria-selected]="isSelected(option)"
        [attr.data-active]="$index + optionOffset() === activeIndex() || null"
        [disabled]="isAtLimit() && !isSelected(option)"
        [id]="optionId($index + optionOffset())"
        class="season-picker__option menu-option listbox-option focus-ring-inset"
        role="option"
        tabindex="-1"
        type="button"
      >
        @if (option.mark) {
          <span aria-hidden="true" class="season-picker__mark">{{ option.mark }}</span>
        } @else {
          <span aria-hidden="true" class="season-picker__mark season-picker__mark--none">—</span>
        }
        <span class="season-picker__option-label">{{ option.label }}</span>
        @if (multiple()) {
          <span
            [class.season-picker__tick--checked]="isSelected(option)"
            aria-hidden="true"
            class="season-picker__tick"
          ></span>
        } @else {
          <span></span>
        }
      </button>
    }
  </div>

  @if (maxSelectionNote() && isAtLimit()) {
    <p class="season-picker__note">
      {{ maxSelectionNote() }}
    </p>
  }
</div>
