<!-- One scene, painted back to front: sky, the moon and its stars, the city held back by haze, the
     terraces, the frontage and its street, then the water and whatever crosses it.

     `xMidYMax meet` keeps the ground line pinned to the bottom of the panel at every width. Every
     full-bleed band is drawn far past the viewBox, and SVG clips to the viewport rather than to the
     viewBox, so the water and the bridge reach the panel's edges without a second drawing. -->
<svg
  [attr.data-hour]="hour()"
  [attr.viewBox]="scene().viewBox"
  [style.--clarity]="clarity()"
  aria-hidden="true"
  class="town-scene"
  preserveAspectRatio="xMidYMax meet"
>
  <defs>
    <!-- Anchored to the scene's own coordinates rather than to the box it is painted on: the rect
         below is drawn far outside the viewBox so it fills any panel, and on object bounding box
         units that would stretch the whole gradient over those two thousand units and leave the
         visible sky as one flat band. Past the last stop SVG pads, which is exactly what a sky
         wants above its top. -->
    <linearGradient gradientUnits="userSpaceOnUse" id="townSky" x1="0" x2="0" y1="-400" y2="340">
      <stop class="town-sky-top" offset="0" />
      <stop class="town-sky-mid" offset="0.55" />
      <stop class="town-sky-low" offset="1" />
    </linearGradient>

    <!-- The hour, kept off the sky's own gradient because that one is morale. -->
    <radialGradient cx="360" cy="290" gradientUnits="userSpaceOnUse" id="townHorizon" r="470">
      <stop class="town-horizon-in" offset="0" />
      <stop class="town-horizon-out" offset="1" />
    </radialGradient>
  </defs>

  <!-- Drawn far past the viewBox on every side, and SVG clips to the viewport rather than to the
       viewBox: one rect therefore fills the panel at any shape it is given. It has to reach this far
       up because the accueil gives the scene the height of a screen — `xMidYMax meet` then pins the
       drawing to the bottom and leaves everything above it to the sky. -->
  <rect fill="url(#townSky)" height="2340" width="5200" x="-2600" y="-2000" />
  <!-- As tall as the sky it washes. Cropped to the horizon's own band it drew its own top edge
       across the sky — a hard line at whatever height the panel happened to put scene y 30, which is
       exactly the black band this scene was reproached for. The radial fades out on its own well
       before it reaches this rect's edges. -->
  <rect fill="url(#townHorizon)" height="2340" width="5200" x="-2600" y="-2000" />

  <!-- The scene is emitted as primitives grouped into layers (see `town-scene.ts`), so one block
       draws every family rather than the whole waterfront being written out shape by shape. -->
  @for (layer of layers(); track $index) {
    <g
      [attr.transform]="layer.transform"
      [class]="layer.className"
      [style.--rise-delay]="layer.delay"
      [style.clip-path]="layer.clip"
    >
      @for (shape of layer.shapes; track $index) {
        @switch (shape.kind) {
          @case ('rect') {
            <rect
              [attr.fill]="shape.fill"
              [attr.height]="shape.h"
              [attr.opacity]="shape.opacity"
              [attr.width]="shape.w"
              [attr.x]="shape.x"
              [attr.y]="shape.y"
            />
          }
          @case ('poly') {
            <polygon
              [attr.fill]="shape.fill"
              [attr.opacity]="shape.opacity"
              [attr.points]="shape.points"
            />
          }
          @case ('path') {
            <path [attr.d]="shape.d" [attr.fill]="shape.fill" [attr.opacity]="shape.opacity" />
          }
          @case ('ellipse') {
            <ellipse
              [attr.cx]="shape.cx"
              [attr.cy]="shape.cy"
              [attr.fill]="shape.fill"
              [attr.opacity]="shape.opacity"
              [attr.rx]="shape.rx"
              [attr.ry]="shape.ry"
            />
          }
          @case ('line') {
            <line
              [attr.opacity]="shape.opacity"
              [attr.stroke-width]="shape.width"
              [attr.stroke]="shape.stroke"
              [attr.x1]="shape.x1"
              [attr.x2]="shape.x2"
              [attr.y1]="shape.y1"
              [attr.y2]="shape.y2"
              stroke-linecap="round"
            />
          }
          @case ('arc') {
            <path
              [attr.d]="shape.d"
              [attr.opacity]="shape.opacity"
              [attr.stroke-width]="shape.width"
              [attr.stroke]="shape.stroke"
              fill="none"
              stroke-linecap="round"
            />
          }
        }
      }
    </g>
  }
</svg>
