<!-- The tabs share the hairline a section rule would draw, splitting the full width between them. -->
<div [attr.aria-label]="'overview.tabs.aria' | translate" class="bar" role="tablist">
  @for (tab of tabs(); track tab.key; let index = $index) {
    <button
      #tab
      (click)="select(tab.key)"
      (keydown)="onKeydown($event, index)"
      [attr.aria-controls]="selected() === tab.key ? panelId() : null"
      [attr.aria-selected]="selected() === tab.key"
      [class.tab--on]="selected() === tab.key"
      [id]="tabId(tab.key)"
      [tabindex]="selected() === tab.key ? 0 : -1"
      class="tab focus-ring-inset"
      role="tab"
      type="button"
    >
      @switch (tab.key) {
        @case ('challenges') {
          <svg aria-hidden="true" class="tab-icon" lucideTarget></svg>
        }
        @case ('contributions') {
          <svg aria-hidden="true" class="tab-icon" lucideUserPen></svg>
        }
        @case ('matches') {
          <svg aria-hidden="true" class="tab-icon" lucideRadio></svg>
        }
        @case ('campaign') {
          <svg aria-hidden="true" class="tab-icon" lucideMap></svg>
        }
      }
      <span class="tab-label">{{ tab.label }}</span>
    </button>
  }
</div>
