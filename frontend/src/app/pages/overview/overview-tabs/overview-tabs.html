<!-- The tabs share the hairline a section rule would draw, splitting the full width between them. -->
<div [attr.aria-label]="'overview.tabs.aria' | translate" class="bar" role="tablist">
  @for (tab of tabs(); track tab.key; let index = $index) {
    <!-- The star sits beside the tab, never inside it: a button cannot hold another. -->
    <div
      #slot
      [attr.data-tab]="tab.key"
      [class.slot--on]="selected() === tab.key"
      class="slot"
      role="presentation"
    >
      <button
        #tab
        (click)="select(tab.key)"
        (keydown)="onKeydown($event, index)"
        [attr.aria-controls]="selected() === tab.key ? panelId() : null"
        [attr.aria-selected]="selected() === tab.key"
        [class.tab--on]="selected() === tab.key"
        [id]="tabId(tab.key)"
        [tabindex]="selected() === tab.key ? 0 : -1"
        class="tab focus-ring-inset"
        role="tab"
        type="button"
      >
        @switch (tab.key) {
          @case ('challenges') {
            <svg aria-hidden="true" class="tab-icon" lucideSunrise></svg>
          }
          @case ('contributions') {
            <svg aria-hidden="true" class="tab-icon" lucideUserPen></svg>
          }
          @case ('matches') {
            <svg aria-hidden="true" class="tab-icon" lucideRadio></svg>
          }
          @case ('campaign') {
            <svg aria-hidden="true" class="tab-icon" lucideMap></svg>
          }
        }
        <span class="tab-label">{{ tab.label }}</span>
        @if (favorite() === tab.key) {
          <span class="sr-only">, {{ 'overview.tabs.favorite.marker' | translate }}</span>
        }
      </button>

      <!-- Only the tab on screen can be pinned; the pinned one keeps its star as a mark. -->
      @if (selected() === tab.key) {
        @let pinned = favorite() === tab.key;
        <button
          (click)="toggleFavorite(tab.key)"
          [attr.aria-label]="
            (pinned ? 'overview.tabs.favorite.unset' : 'overview.tabs.favorite.set') | translate
          "
          [attr.title]="
            (pinned ? 'overview.tabs.favorite.unset' : 'overview.tabs.favorite.set') | translate
          "
          [class.star--pinned]="pinned"
          class="star focus-ring-inset"
          type="button"
        >
          <svg aria-hidden="true" class="star-icon" lucideStar></svg>
        </button>
      } @else if (favorite() === tab.key) {
        <span aria-hidden="true" class="star star--pinned star--mark">
          <svg class="star-icon" lucideStar></svg>
        </span>
      }
    </div>
  }
</div>
