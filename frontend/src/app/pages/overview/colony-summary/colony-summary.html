@if (colony.colony()) {
  <section class="flex flex-col">
    <!-- Section rule: the same header treatment as the progress panel under it and the podium
         beside it, so the left column reads as two blocks of one page rather than a card stack. -->
    <div class="flex items-center gap-3">
      <h2
        class="font-display text-sm leading-none font-semibold tracking-label text-text-secondary uppercase"
      >
        {{ 'campaign.title' | translate }}
      </h2>
      <span
        aria-hidden="true"
        class="h-px flex-1 bg-linear-to-r from-brand-500/50 to-transparent"
      ></span>
      <!-- The day is the one figure of the block that moves every morning, and the only one the
           band below cannot say, so it closes the rule where the other panels close it with a
           diamond. -->
      <span class="font-mono text-2xs text-text-muted tabular-nums">{{ runDayLabel() }}</span>
    </div>

    <!-- The whole readout is the link to the run's own page: every figure in it is a reason to
         open that page, so none of them is a target of its own — which is also why the band is
         drawn compact, a link being allowed to hold neither button nor hover card.
         No frame and no ground at rest: the section rule above already sets the block apart, the
         same way it does for the progress panel under it and the podium beside it. The ground only
         comes up under the pointer, which is what carries the affordance now that no chevron
         announces the link — and it is bled out past the content with a negative margin so the
         figures stay flush with the rule above them. -->
    <a
      [appTooltip]="'overview.colonySummary.hint' | translate"
      [appTooltipDelay]="tooltipDelayMs"
      [attr.aria-label]="'overview.colonySummary.link' | translate"
      [routerLink]="'/campaign'"
      appTooltipPosition="right"
      class="focus-ring -mx-3 mt-2 flex items-center gap-4 px-3 py-3 transition-colors hover:bg-text-primary/4 sm:gap-6"
    >
      <app-colony-resource-band
        [attractivity]="colony.attractivity()"
        [battery]="colony.battery()"
        [compact]="true"
        [delta]="colony.delta()"
        [foodRing]="colony.foodRing()"
        [populationLabel]="colony.populationLabel()"
        [populationPercentage]="colony.populationPercentage()"
      />
    </a>
  </section>
}
