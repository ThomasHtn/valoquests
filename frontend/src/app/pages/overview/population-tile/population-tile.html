@if (colony.colony()) {
  <div class="flex h-full flex-col">
    <!-- Section rule: the same header treatment as the boss card beside it, so the boss row opens
         on two headers of one system rather than a bare tile beside a titled card. -->
    <div class="flex items-center gap-3">
      <h2
        class="font-display text-sm leading-tight font-semibold tracking-label text-text-secondary uppercase"
      >
        {{ 'overview.populationTile.title' | translate }}
      </h2>
      <span
        aria-hidden="true"
        class="h-px flex-1 bg-linear-to-r from-brand-500/50 to-transparent"
      ></span>
      <span aria-hidden="true" class="size-2 rotate-45 border border-brand-500/70"></span>
    </div>

    <!-- Glyph on the left, headcount on the right: the same hexagon the campaign page's own
         population tile carries, at rest rather than behind an info bubble now that the header
         above already names the block. -->
    <a
      [attr.aria-label]="'overview.populationTile.link' | translate"
      [routerLink]="'/campaign'"
      class="focus-ring mt-3 flex flex-1 items-center justify-center gap-4 border border-brand-500/30 bg-brand-500/8 px-6 py-5 transition-colors hover:bg-brand-500/14"
    >
      <span class="relative h-28 w-24 shrink-0 sm:h-36 sm:w-32">
        <!-- The same pulsing halo as the boss card's own hexagon beside it, so the two glyphs
             opening the row read as one system. -->
        <span
          aria-hidden="true"
          class="clip-hex absolute -inset-1.5 bg-brand-500/25 motion-safe:animate-pulse"
        ></span>

        <span aria-hidden="true" class="clip-hex absolute inset-0 bg-brand-500"></span>
        <span class="clip-hex absolute inset-0.5 overflow-hidden bg-surface-950">
          <span class="flex h-full w-full items-center justify-center">
            <svg class="h-14 w-14 text-brand-500 sm:h-16 sm:w-16" lucideUsers></svg>
          </span>
        </span>
      </span>

      <span class="flex flex-col gap-0.5">
        <span
          class="font-display text-4xl leading-none font-bold text-text-primary tabular-nums sm:text-5xl"
        >
          {{ colony.populationLabel() }}
          @if (colony.delta(); as delta) {
            <span
              [class]="deltaColorClass(delta)"
              class="align-super font-display text-xs font-bold tabular-nums"
            >
              {{ delta.label }}
            </span>
          }
        </span>
        <span class="font-display text-base font-bold text-text-secondary sm:text-lg">
          {{ 'colony.population' | translate }}
        </span>
      </span>
    </a>
  </div>
}
