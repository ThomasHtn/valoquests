@let cell = this.cell();
@if (cell.kind === 'ahead') {
  <div class="ledger-cell__plot"></div>
} @else {
  <div aria-hidden="true" class="ledger-cell__plot">
    <span [attr.data-value]="format(cell.got)" class="ledger-cell__gained tabular-nums"></span>
    @if (cell.kind === 'now') {
      <span class="ledger-cell__since-monday">{{ 'campaign.ledger.sinceMonday' | translate }}</span>
    } @else {
      <span
        [attr.data-value]="'campaign.ledger.spentSunday' | translate: { count: format(cell.spent) }"
        class="ledger-cell__spent tabular-nums"
      ></span>
      <span class="ledger-cell__carried"></span>
    }
  </div>
}
