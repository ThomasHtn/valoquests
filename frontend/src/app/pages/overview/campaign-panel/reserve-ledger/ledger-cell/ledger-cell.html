@let cell = this.cell();
@if (cell.kind === 'ahead') {
  <div class="lg-plot"></div>
} @else {
  <div aria-hidden="true" class="lg-plot">
    <span [attr.data-v]="format(cell.got)" class="lg-up tabular-nums"></span>
    @if (cell.kind === 'now') {
      <span class="lg-now">{{ 'campaign.ledger.sinceMonday' | translate }}</span>
    } @else {
      <span
        [attr.data-v]="'campaign.ledger.spentSunday' | translate: { count: format(cell.spent) }"
        class="lg-down tabular-nums"
      ></span>
      <span class="lg-carry"></span>
    }
  </div>
}
