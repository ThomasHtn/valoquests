<app-resource-state
  [emptyText]="'overview.miniRanking.empty' | translate"
  [errorText]="'overview.miniRanking.error' | translate"
  [isEmpty]="top3().length === 0"
  [isError]="hasError()"
  [isLoading]="isLoading()"
  [loadingText]="'overview.miniRanking.loading' | translate"
  padding="py-6"
>
  <!-- The frame is gone — the section rule above names the block, so the rows sit straight on the
       page like the profile's match history. They share whatever height the column has, so the
       third one ends level with the block beside it. -->
  <ul class="flex min-h-0 flex-1 flex-col gap-2">
    @for (entry of top3(); track entry.player.id) {
      <li class="flex min-h-0 flex-1">
        <a
          [routerLink]="['/players', entry.player.id]"
          class="mini-rank-row focus-ring-inset row flex min-h-12 w-full items-center gap-3 py-2 pr-3 pl-3"
        >
          <app-position-badge [position]="entry.position" />
          <app-avatar [src]="resolveAvatarUrl(entry.player.portrait)" size="sm" />
          <span class="font-display min-w-0 flex-1 truncate font-semibold text-text-primary">
            {{ entry.player.displayName }}
          </span>
          <!-- Damage in `accent-gold`, the same amber `/week` prices a challenge in: it is one
               currency across the app, and the ranking is that currency totalled. -->
          <span
            class="font-display shrink-0 text-[1.0625rem] font-bold text-accent-gold tabular-nums"
          >
            {{ formatDamage(entry.totalDamage) }}
            <span class="mini-rank-unit font-mono">
              {{ 'overview.miniRanking.damageUnit' | translate }}
            </span>
          </span>
        </a>
      </li>
    }
  </ul>
</app-resource-state>
