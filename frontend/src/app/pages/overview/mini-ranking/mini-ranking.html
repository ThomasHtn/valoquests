<section class="flex flex-col">
  <div class="flex items-center gap-3">
    <h2
      class="font-display text-sm leading-tight font-semibold tracking-label text-text-secondary uppercase"
    >
      {{ 'overview.miniRanking.title' | translate }}
    </h2>
    <span
      aria-hidden="true"
      class="h-px flex-1 bg-linear-to-r from-brand-500/50 to-transparent"
    ></span>
    <a
      [routerLink]="'/leaderboard'"
      class="label-caption shrink-0 text-brand-400 transition-colors hover:text-brand-300"
    >
      {{ 'overview.miniRanking.link' | translate }}
      <span aria-hidden="true">→</span>
    </a>
  </div>

  <app-resource-state
    [emptyText]="'overview.miniRanking.empty' | translate"
    [errorText]="'overview.miniRanking.error' | translate"
    [isEmpty]="top3().length === 0"
    [isError]="hasError()"
    [isLoading]="isLoading()"
    [loadingText]="'overview.miniRanking.loading' | translate"
    padding="py-6"
  >
    <ul class="mt-3 flex flex-col gap-1.5">
      @for (entry of top3(); track entry.player.id) {
        <li>
          <a
            [routerLink]="['/players', entry.player.id]"
            class="mini-rank-row notch-tr focus-ring-inset flex items-center gap-3 py-2.5 pr-3 pl-3 transition-colors [--notch:0.5rem] hover:bg-text-primary/8"
          >
            <span
              [class.text-brand-400]="entry.position === 1"
              class="w-5 shrink-0 font-mono text-[0.8125rem] text-text-muted tabular-nums"
            >
              {{ entry.position }}
            </span>
            <app-avatar [src]="resolveAvatarUrl(entry.player.portrait)" size="sm" />
            <span class="font-display min-w-0 flex-1 truncate font-semibold text-text-primary">
              {{ entry.player.displayName }}
            </span>
            <span class="font-display text-[1.0625rem] font-bold text-text-primary tabular-nums">
              {{ formatDamage(entry.totalDamage) }}
            </span>
          </a>
        </li>
      }
    </ul>
  </app-resource-state>
</section>
