<!-- Context bar: the page and the active week on the caption line, what the week is about as the
     title itself, and the countdown at the trailing edge — the one piece of the old scroll-snap
     hero that belongs in the chrome rather than inside the boss card below, where it now stays on
     screen for the whole page. -->
<app-page-header
  [eyebrow]="
    'pageHeader.weekHeading'
      | translate: { page: 'overview.header.title' | translate, number: week()?.number ?? '—' }
  "
  [heading]="'overview.header.subheading' | translate"
>
  <app-week-countdown [remaining]="week()?.remaining ?? null" />
</app-page-header>

<div class="page-body">
  <app-boss-encounter />

  <!-- The week's state on the left, the week's ranking on the right: both summarize "how is the
     week going" and share the screen evenly rather than stacking as full-width strips.

     Left to stretch rather than aligned to the start: every panel is a section rule opening on the
     same line, and letting the two columns share the row's height makes them close on the same
     line too.

     The left column carries two blocks, read top to bottom as the two scales the week is played
     on: the run it belongs to, then the week itself. The run's block sits at its natural height
     and the progress panel takes what is left, which is what keeps the column's bottom edge on
     the podium's. -->
  <!-- The column gap stays wider than the gap inside the left column: the two are different
       joints. Between the columns it is what parts the week's state from the week's ranking;
       inside, it only stacks two blocks of the same column. Equal gaps would read the left column
       as three panels in a row rather than two beside one. -->
  <div class="grid gap-6 lg:grid-cols-2 lg:gap-x-12">
    <div class="flex flex-col gap-10">
      <app-colony-summary />
      <app-team-progress />
    </div>
    <app-podium />
  </div>
</div>
