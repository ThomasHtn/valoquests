<h1 class="sr-only">{{ 'overview.title' | translate }}</h1>

<!-- Escapes the ancestor route wrapper (`app.html`'s `<main>` padding and `max-w-[1440px]` cap)
     via `absolute` positioning anchored to `<main>` itself (see its `relative`), rather than
     rendering in the normal document flow like every other page's `PAGE_LAYOUT_CLASS` stack. Two
     things make that escape necessary rather than cosmetic: this page owns a single full-height
     scroll-snap container, which needs `<main>`'s exact box to size itself against `dvh`-free; and
     on displays wider than the cap, the centering gutters it leaves are otherwise a dead zone
     where wheel scrolling does nothing, since neither the capped wrapper nor `<main>` (which never
     overflows — see below) is scrollable there. `inset-4`/`sm:inset-6` reproduce that wrapper's
     `p-4`/`sm:p-6` visual padding directly against `<main>`'s true edges instead. -->
<div class="absolute inset-4 flex flex-col sm:inset-6">
  <!-- Hides the scrollbar at `lg` and up, where the dot rail already doubles as the scroll
       position indicator (per its own doc comment, the primary way desktop users are meant to
       navigate sections); scrolling itself is unaffected, including via keyboard through this
       element's `tabindex`. Below `lg`, with no dot rail rendered, the native scrollbar remains the
       only such indicator. That hiding rule lives in `styles.css` as plain, unlayered CSS keyed off
       `overview-scroll-container` below — a Tailwind utility here would sit inside the generated
       utilities layer and lose to the unlayered global scrollbar rule there regardless of
       specificity. -->
  <div
    #scrollContainer
    id="overview-scroll-container"
    class="flex min-h-0 flex-1 snap-y snap-mandatory flex-col overflow-y-auto motion-safe:scroll-smooth"
    tabindex="0"
  >
    <!-- Each section re-caps its own content at `max-w-[1440px]`, the width the ancestor wrapper
         used to cap for free, since the container above now deliberately spans `<main>`'s full
         width to keep it scrollable edge to edge. `lg:pr-20` reserves room so the dot rail below
         never overlaps section content; it lives on each section rather than on the scroll
         container above, so it shrinks this same `mx-auto`-centered box instead of shifting it
         off-center against the container's own, wider one. -->
    <section
      #sectionRef
      class="mx-auto flex min-h-full w-full max-w-[1440px] shrink-0 flex-col justify-center gap-6 py-6 snap-start snap-always lg:pr-20"
      id="overview-hero"
    >
      <p
        class="mx-auto max-w-2xl text-center text-lg font-bold tracking-tight text-text-secondary sm:text-xl md:text-2xl"
      >
        {{ 'overview.subtitle' | translate }}
      </p>
      <app-podium />
      <app-team-progress [week]="week()" />
    </section>

    <section
      #sectionRef
      class="mx-auto flex min-h-full w-full max-w-[1440px] shrink-0 flex-col justify-center py-6 snap-start snap-always lg:pr-20"
      id="overview-challenges"
    >
      <app-weekly-challenges />
    </section>

    <section
      #sectionRef
      class="mx-auto flex min-h-full w-full max-w-[1440px] shrink-0 flex-col justify-center py-6 snap-start snap-always lg:pr-20"
      id="overview-ranking"
    >
      <app-weekly-ranking />
    </section>
  </div>

  <!-- Desktop-only: on touch devices, the same sections are already reachable with a natural swipe
       per section, so a second, more cramped navigation aid is not added there. A sibling of the
       scroll container rather than a descendant, so it stays fixed in place while that container
       scrolls. Re-caps at `max-w-[1440px]` with the same `lg:pr-20` reservation as the scroll
       container, so the two center identically and the dot rail hugs the visible card edge instead
       of drifting into the full-bleed gutter the scroll container now spans on displays wider than
       the cap. `pointer-events-none` here (the buttons re-enable their own) keeps this wrapper from
       shadowing wheel scroll over that gutter. -->
  <div class="pointer-events-none absolute inset-0 mx-auto w-full max-w-[1440px] lg:pr-20">
    <nav
      [attr.aria-label]="'overview.sections.navLabel' | translate"
      class="pointer-events-none absolute top-1/2 right-2 hidden -translate-y-1/2 flex-col gap-3 sm:right-4 lg:flex"
    >
      @for (section of sections; track section.id) {
        <button
          (click)="scrollToSection(section.id)"
          [attr.aria-current]="activeSectionId() === section.id ? 'true' : null"
          [attr.aria-label]="section.ariaLabelKey | translate"
          [class.bg-brand-500]="activeSectionId() === section.id"
          [class.bg-surface-600]="activeSectionId() !== section.id"
          class="focus-ring pointer-events-auto h-2.5 w-2.5 shrink-0 rounded-full transition-colors hover:bg-brand-400"
          type="button"
        ></button>
      }
    </nav>
  </div>
</div>
