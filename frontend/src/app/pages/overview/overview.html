<!-- Context bar: the page and the active week on the caption line, what the week is about as the
     title itself, and the countdown at the trailing edge — the one piece of the old scroll-snap
     hero that belongs in the chrome rather than inside the boss card below, where it now stays on
     screen for the whole page. -->
<app-page-header
  [eyebrow]="
    'pageHeader.weekHeading'
      | translate: { page: 'overview.header.title' | translate, number: week()?.number ?? '—' }
  "
  [heading]="'overview.header.subheading' | translate"
>
  <app-week-countdown [remaining]="week()?.remaining ?? null" />
</app-page-header>

<div class="page-body">
  <app-boss-encounter />

  <!-- Collective progress and podium side by side, per the mockup: both summarize "how is the
     week going" and share the screen evenly rather than stacking as two full-width strips.

     Left to stretch rather than aligned to the start: both panels are section rules opening on the
     same line, and letting them share the row's height makes them close on the same line too, each
     spreading its own content over that height. -->
  <div class="grid gap-6 lg:grid-cols-2">
    <app-team-progress />
    <app-podium />
  </div>

  <!-- The run's colony, in one line: it answers a different question from everything above it —
       "how is the run going" rather than "how is the week going" — so it closes the page rather
       than competing with the week's own blocks, and links to the page that details it. -->
  <app-colony-summary />
</div>
