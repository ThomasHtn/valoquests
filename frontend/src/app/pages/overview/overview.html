<!-- Header: active week, page title and countdown, matching the "Vue d'ensemble" mockup's single,
     non-scrolling hero screen. Unlike the other pages' `<header>` (title + subtitle), this one
     also carries the countdown on its trailing edge — the one piece of the old scroll-snap hero
     that belongs at the very top rather than inside the boss card below. -->
<header class="flex flex-wrap items-start justify-between gap-4">
  <div>
    <p class="tracking-label-wide font-mono text-2xs font-medium text-brand-500 uppercase">
      {{ 'overview.header.eyebrow' | translate: { number: week()?.number ?? '—' } }}
    </p>
    <h1
      class="font-display mt-2 text-2xl leading-none font-bold text-text-primary uppercase sm:text-3xl"
    >
      {{ 'overview.header.title' | translate }}
    </h1>
  </div>

  <app-week-countdown [remaining]="week()?.remaining ?? null" />
</header>

<!-- Thin divider, diamond-tipped, echoing the mockup's separator between the header and the boss
     card. -->
<app-section-divider class="-mt-2" />

<app-boss-encounter />

<app-team-progress />

<app-podium />
