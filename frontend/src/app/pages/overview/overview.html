<!-- Context bar: the page and the active week on the caption line, what the week is about as the
     title itself, and the countdown at the trailing edge — the one piece of the old scroll-snap
     hero that belongs in the chrome rather than inside the boss card below, where it now stays on
     screen for the whole page. -->
<app-page-header
  [eyebrow]="
    'pageHeader.weekHeading'
      | translate: { page: 'overview.header.title' | translate, number: week()?.number ?? '—' }
  "
  [heading]="'overview.header.subheading' | translate"
>
  <app-week-countdown [remaining]="week()?.remaining ?? null" />
</app-page-header>

<div class="page-body">
  <!-- The run's own standing beside the week's fight: the population tile is the run's whole
       answer in one figure, so it stands narrow at the boss card's side rather than under its own
       heading, and doubles as the link into `/campaign` the way the retired summary band did. -->
  <div class="grid gap-4 lg:grid-cols-4">
    <app-population-tile class="lg:col-span-1" />
    <app-boss-encounter class="lg:col-span-3" />
  </div>

  <!-- The week's ranking on the right, the week's collective progress on the left: both summarize
     "how is the week going" and share the screen evenly rather than stacking as full-width strips.

     Left to stretch rather than aligned to the start: both panels are a section rule opening on
     the same line, and letting the row share its height makes them close on the same line too. -->
  <div class="grid gap-6 lg:grid-cols-2 lg:gap-x-12">
    <app-team-progress />
    <app-podium />
  </div>
</div>
