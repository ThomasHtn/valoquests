<!-- Header: active week, page title and countdown, matching the "Vue d'ensemble" mockup's single,
     non-scrolling hero screen. The countdown rides on the header's trailing edge — the one piece
     of the old scroll-snap hero that belongs at the very top rather than inside the boss card
     below. -->
<app-page-header
  [eyebrow]="'overview.header.eyebrow' | translate: { number: week()?.number ?? '—' }"
  [heading]="'overview.header.title' | translate"
>
  <app-week-countdown [remaining]="week()?.remaining ?? null" />
</app-page-header>

<!-- Thin divider, diamond-tipped, echoing the mockup's separator between the header and the boss
     card. -->
<app-section-divider />

<app-boss-encounter />

<!-- Collective progress and podium side by side, per the mockup: both summarize "how is the
     week going" and share the screen evenly rather than stacking as two full-width strips.

     Left to stretch rather than aligned to the start: both panels are section rules opening on the
     same line, and letting them share the row's height makes them close on the same line too, each
     spreading its own content over that height. -->
<div class="grid gap-6 lg:grid-cols-2">
  <app-team-progress />
  <app-podium />
</div>
