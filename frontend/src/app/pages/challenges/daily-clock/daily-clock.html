<span
  [appTooltip]="'challenges.daily.countdownAria' | translate"
  [attr.aria-label]="('challenges.daily.endsIn' | translate) + ' ' + label()"
  class="clock focus-ring tabular-nums"
  role="timer"
  tabindex="0"
>
  <svg aria-hidden="true" class="size-3" lucideClock></svg>
  <span aria-hidden="true">{{ label() }}</span>
</span>
