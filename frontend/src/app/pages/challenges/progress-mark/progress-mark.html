@let mark = this.mark();

<!-- The bubble lays out the exact figures the ring rounds; assistive tech reads them from the
     sr-only span instead. -->
<span [appTooltipTemplate]="tip" [appTooltip]="mark.tip" aria-hidden="true" class="cell">
  @if (mark.done) {
    <!-- The arc closes all the way, then the disc fills under the check. -->
    <span appInView class="dial dial--done" style="--level: 1">
      <svg class="dial-face" viewBox="0 0 48 48">
        <circle class="track" cx="24" cy="24" r="21" />
        <circle class="arc fx-arc" cx="24" cy="24" r="21" />
        <circle class="disc" cx="24" cy="24" r="22.5" />
      </svg>
      <svg class="check" lucideCheck></svg>
      @for (piece of confetti; track $index) {
        <span
          [class.piece--pale]="piece.pale"
          [class.piece--strip]="piece.strip"
          [style.--angle.deg]="piece.angle"
          [style.--reach.rem]="piece.distance"
          [style.--spin.deg]="piece.spin"
          class="piece"
        ></span>
      }
    </span>
  } @else if (mark.idle) {
    <span class="dash">—</span>
  } @else {
    <span [style.--level]="mark.fraction" appInView class="dial">
      <svg class="dial-face" viewBox="0 0 48 48">
        <circle class="track" cx="24" cy="24" r="21" />
        <circle class="arc fx-arc" cx="24" cy="24" r="21" />
      </svg>
      <span
        [class.label--long]="mark.unit !== '' || mark.figure.length > 2"
        class="label tabular-nums"
        >{{ mark.figure }}
        @if (mark.unit) {
          <span class="unit">{{ mark.unit }}</span>
        }
      </span>
    </span>
  }
</span>
<span class="sr-only">{{ mark.tip }}</span>

<ng-template #tip><app-progress-tip [detail]="mark.detail" /></ng-template>
