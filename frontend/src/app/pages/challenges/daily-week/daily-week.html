<div
  [attr.aria-label]="'challenges.daily.strip' | translate"
  class="daily-week__strip"
  role="group"
>
  @for (day of days(); track day.index) {
    <button
      (click)="pick(day)"
      [appTooltip]="day.tip"
      [attr.aria-disabled]="day.drawn ? null : true"
      [attr.aria-label]="day.weekday + ' ' + day.date + ', ' + day.tip"
      [attr.aria-pressed]="day.drawn ? selected() === day.index : null"
      [class]="'daily-week__day--' + day.state"
      [class.daily-week__day--hit]="day.drawn && day.doneCount > 0"
      [class.daily-week__day--picked]="selected() === day.index"
      class="daily-week__day focus-ring-inset"
      type="button"
    >
      <span aria-hidden="true" class="daily-week__day-name">
        @if (initials() || slim()) {
          {{ day.weekday.charAt(0) }}
        } @else {
          {{ day.weekday }} {{ day.date }}
        }
      </span>
      @if (!slim()) {
        <span aria-hidden="true" class="daily-week__day-score tabular-nums">
          @if (day.drawn) {
            {{ day.doneCount }}/{{ day.total }}
          } @else {
            —
          }
        </span>
      }
    </button>
  }
</div>
