<div class="challenge-deck__squad">
  <p class="challenge-deck__hint">{{ 'challenges.board.pinHint' | translate }}</p>
  <div
    [attr.aria-label]="'challenges.board.squad' | translate"
    class="challenge-deck__squad-row"
    role="group"
  >
    @for (operator of operators(); track operator.playerId) {
      <button
        (click)="pin.emit(operator.playerId)"
        [appTooltip]="operator.summary"
        [attr.aria-label]="
          ((operator.pinned ? 'challenges.board.unpin' : 'challenges.board.pin')
            | translate: { name: operator.name }) +
          '. ' +
          operator.summary
        "
        [attr.aria-pressed]="operator.pinned"
        appTooltipPosition="below"
        class="challenge-deck__operator focus-ring"
        type="button"
      >
        <app-avatar [src]="operator.portrait" size="sm" />
        <span aria-hidden="true" class="challenge-deck__operator-name">{{ operator.name }}</span>
        @if (operator.pinned) {
          <svg aria-hidden="true" class="challenge-deck__operator-star" lucideStar></svg>
        }
      </button>
    }
  </div>
</div>

@for (row of rows(); track row.key) {
  <app-deck-card [row]="row">
    @if (row.daily) {
      <app-daily-week
        [(selected)]="pickedDay"
        [days]="days()"
        [initials]="true"
        class="challenge-deck__tally"
      />
    }
  </app-deck-card>
}
