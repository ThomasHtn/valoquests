<app-page-header [heading]="'challenges.header.heading' | translate">
  <app-week-countdown [remaining]="remaining()" />
</app-page-header>

<div class="page-body">
  <main class="flex flex-col gap-[clamp(2.5rem,4vw,3.25rem)] pb-20">
    <app-resource-state
      (retry)="retry()"
      [emptyPlate]="emptyPlate()"
      [errorText]="'challenges.state.error' | translate"
      [isEmpty]="!hasChallenges()"
      [isError]="isError()"
      [isLoading]="isLoading()"
      [loadingText]="'challenges.state.loading' | translate"
      emptyKind="waiting"
      padding="px-4 py-10 sm:px-6"
    >
      <!-- One board, two layouts: the table from a wide column, a card per challenge below it. -->
      <section [attr.aria-label]="'challenges.board.title' | translate" class="board">
        <app-challenge-board
          (pin)="togglePin($event)"
          [(pickedDay)]="pickedDay"
          [days]="days()"
          [operators]="boardOperators()"
          [period]="period()"
          [rescueActive]="rescueActive()"
          [rows]="boardRows()"
          class="board-table"
        />
        <app-challenge-deck
          (pin)="togglePin($event)"
          [(pickedDay)]="pickedDay"
          [days]="days()"
          [operators]="boardOperators()"
          [rows]="boardRows()"
          class="board-deck"
        />
      </section>
    </app-resource-state>

    <!-- Outside the state above: the catalogue stays readable while no campaign has drawn anything. -->
    @if (!isLoading()) {
      <!-- The catalogue is folded: a reserve to consult, not an entry point. Its bar is the
           section's own title, and nothing of the hundred-odd rows exists before it opens. -->
      <section aria-labelledby="catalogue-title">
        <details (toggle)="toggleCatalogue($event)" class="fold">
          <summary class="fold-bar focus-ring">
            <h2
              class="font-display text-[clamp(1.5rem,1.1rem+1.1vw,2rem)] leading-tight font-semibold tracking-[0.01em] text-brand-400 uppercase"
              id="catalogue-title"
            >
              {{ 'challenges.catalogue.title' | translate }}
            </h2>
            <span
              aria-hidden="true"
              class="h-px flex-[1_1_3rem] bg-linear-to-r from-brand-500/50 to-transparent max-sm:basis-4"
            ></span>
            <!-- Same cue as a section rule's link: before the diamond, under the rule on a phone. -->
            <span
              class="fold-cue tracking-label font-mono text-xs font-medium text-brand-400 uppercase transition-colors"
            >
              {{
                (catalogueOpen() ? 'challenges.catalogue.hide' : 'challenges.catalogue.show')
                  | translate
              }}
            </span>
            <span aria-hidden="true" class="size-2 rotate-45 border border-brand-500/70"></span>
          </summary>
          @if (catalogueOpen()) {
            <app-resource-state
              (retry)="retryCatalogue()"
              [errorText]="'challenges.catalogue.error' | translate"
              [isError]="catalogueError()"
              [isLoading]="catalogueLoading()"
              [loadingText]="'challenges.catalogue.loading' | translate"
              padding="py-8"
            >
              <app-challenge-catalogue [groups]="catalogueGroups()" />
            </app-resource-state>
          }
        </details>
      </section>
    }
  </main>
</div>
