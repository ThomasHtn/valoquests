<app-page-header [heading]="'challenges.header.heading' | translate">
  <app-week-countdown [remaining]="remaining()" />
</app-page-header>

<div class="page-body">
  <main class="challenges__content flex flex-col pb-20">
    <app-resource-state
      (retry)="retry()"
      [emptyPlate]="emptyPlate()"
      [errorText]="'challenges.state.error' | translate"
      [isEmpty]="!hasChallenges()"
      [isError]="isError()"
      [isLoading]="isLoading()"
      [loadingText]="'challenges.state.loading' | translate"
      emptyKind="waiting"
      padding="page"
    >
      <section [attr.aria-label]="'challenges.board.title' | translate" class="challenges__board">
        <app-challenge-board
          (pin)="togglePin($event)"
          [(pickedDay)]="pickedDay"
          [days]="days()"
          [operators]="boardOperators()"
          [period]="period()"
          [rescueActive]="rescueActive()"
          [rows]="boardRows()"
          class="challenges__table"
        />
        <app-challenge-deck
          (pin)="togglePin($event)"
          [(pickedDay)]="pickedDay"
          [days]="days()"
          [operators]="boardOperators()"
          [rows]="boardRows()"
          class="challenges__deck"
        />
      </section>
    </app-resource-state>

    <!-- Outside the state above, so it stays readable before any draw. -->
    @if (!isLoading()) {
      <!-- Folded: none of its rows exist before it opens. -->
      <section aria-labelledby="catalogue-title">
        <details
          (toggle)="toggleCatalogue($event)"
          [open]="catalogueOpen()"
          class="challenges__fold"
        >
          <summary class="challenges__fold-bar focus-ring">
            <h2 class="challenges__fold-title" id="catalogue-title">
              {{ 'challenges.catalogue.title' | translate }}
            </h2>
            <span aria-hidden="true" class="challenges__fold-rule"></span>
            <!-- Same cue as a section rule's link. -->
            <span class="challenges__fold-cue">
              {{
                (catalogueOpen() ? 'challenges.catalogue.hide' : 'challenges.catalogue.show')
                  | translate
              }}
            </span>
            <span aria-hidden="true" class="challenges__fold-diamond"></span>
          </summary>
          @if (catalogueOpen()) {
            <app-resource-state
              (retry)="retryCatalogue()"
              [errorText]="'challenges.catalogue.error' | translate"
              [isError]="catalogueError()"
              [isLoading]="catalogueLoading()"
              [loadingText]="'challenges.catalogue.loading' | translate"
              padding="fold"
            >
              <app-challenge-catalogue [groups]="catalogueGroups()" />
            </app-resource-state>
          }
        </details>
      </section>
    }
  </main>
</div>
