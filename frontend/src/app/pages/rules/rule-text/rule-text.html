@for (run of runs(); track $index) {
  @if (run.icon) {
    <!-- The icon is a word: it sits in the line at the text's own size, on its baseline, and the
         word it stands for is written right next to it in the dictionary. -->
    <span
      [class]="run.tone"
      aria-hidden="true"
      class="inline-block size-[1em] translate-y-[0.15em]"
    >
      <svg [lucideIcon]="concepts[run.icon]" class="size-full"></svg>
    </span>
  } @else {
    <!-- One element per run, on one line: Angular drops whitespace-only nodes between elements,
         so the spacing a reader sees is the sentence's own, never the template's indentation. -->
    <span [class.font-semibold]="run.strong" [class.text-text-primary]="run.strong">{{
      run.text
    }}</span>
  }
}
