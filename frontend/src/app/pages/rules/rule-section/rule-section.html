<section [class.rule-section--first]="!bordered()" [id]="anchor()" class="rule-section">
  <div class="flex flex-col gap-3">
    <div class="flex items-baseline gap-3">
      <span aria-hidden="true" class="rule-section__index">{{ index() }}</span>
      <h2 class="rule-section__heading">{{ heading() }}</h2>
    </div>
    <p class="rule-section__statement">{{ statement() }}</p>
    @if (description()) {
      <app-rule-text [text]="description()" class="rule-section__description" />
    }
  </div>

  <ng-content />
</section>
