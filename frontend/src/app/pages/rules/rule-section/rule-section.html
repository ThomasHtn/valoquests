<!-- `scroll-mt` clears the context bar a jump would otherwise land the heading under: the page's
     own scroller is `page-body`, which starts below that bar, so a section scrolled to its top sits
     flush against it. -->
<section
  [class.border-t]="bordered()"
  [class.pt-0]="!bordered()"
  [class.lg:pt-0]="!bordered()"
  [id]="anchor()"
  class="grid scroll-mt-4 items-start gap-x-10 gap-y-5 border-edge py-7 lg:grid-cols-[minmax(0,19rem)_minmax(0,1fr)] lg:gap-x-24 lg:py-9 xl:gap-x-40"
>
  <div>
    <div class="flex items-baseline gap-3">
      <span
        aria-hidden="true"
        class="font-display text-2xl leading-none font-bold text-brand-500 tabular-nums"
      >
        {{ index() }}
      </span>
      <h2 class="font-display text-lg leading-tight font-semibold text-text-primary uppercase">
        {{ heading() }}
      </h2>
    </div>
    <app-rule-text [text]="description()" class="mt-3 block text-prose text-text-secondary" />
  </div>

  <ng-content />
</section>
