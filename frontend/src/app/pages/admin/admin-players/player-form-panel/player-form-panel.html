<!-- Right-anchored drawer, same margin/height overrides as the campaign detail panel this mirrors:
     they pin the dialog to the viewport's right edge at full height instead of the user-agent's
     default centering. -->
<dialog
  #dialog
  (close)="closed.emit()"
  aria-labelledby="player-form-title"
  class="m-0 ml-auto h-dvh max-h-dvh w-full max-w-md border-l border-brand-500/30 bg-surface-sunken p-0 text-text-primary backdrop:bg-surface-sunken/75 motion-safe:animate-[drawer-enter_200ms_ease-out]"
>
  <form (submit)="submit($event)" class="flex h-full flex-col gap-6 overflow-y-auto p-5 sm:p-7">
    <div class="flex items-center justify-between gap-2">
      <h2
        class="font-display text-xl leading-none font-bold text-text-primary uppercase"
        id="player-form-title"
      >
        {{
          (editedPlayer() ? 'admin.players.form.editHeading' : 'admin.players.form.createHeading')
            | translate
        }}
      </h2>

      <button
        (click)="close()"
        [attr.aria-label]="'admin.cancel' | translate"
        class="focus-ring-inset flex size-9 shrink-0 cursor-pointer items-center justify-center border border-text-primary/15 text-text-secondary transition-colors hover:bg-text-primary/10 hover:text-text-primary"
        type="button"
      >
        <svg aria-hidden="true" class="size-4" lucideX></svg>
      </button>
    </div>

    <label class="block">
      <span class="tracking-label block font-mono text-xs text-text-muted uppercase">
        {{ 'admin.players.form.gameName' | translate }}
      </span>
      <div
        class="notch-tr mt-2 h-11 bg-text-muted p-px transition-colors [--notch:0.5rem] focus-within:bg-brand-500 has-[:disabled]:opacity-60"
      >
        <div class="notch-tr h-full bg-surface-sunken [--notch:0.5rem]">
          <input
            (input)="onGameNameInput($event)"
            [disabled]="busy()"
            [value]="gameName()"
            autocomplete="off"
            class="h-full w-full bg-transparent px-3 text-sm text-text-primary focus:outline-none"
            maxlength="32"
            required
            type="text"
          />
        </div>
      </div>
    </label>

    <label class="block">
      <span class="tracking-label block font-mono text-xs text-text-muted uppercase">
        {{ 'admin.players.form.tagLine' | translate }}
      </span>
      <div
        class="notch-tr mt-2 h-11 bg-text-muted p-px transition-colors [--notch:0.5rem] focus-within:bg-brand-500 has-[:disabled]:opacity-60"
      >
        <div class="notch-tr h-full bg-surface-sunken [--notch:0.5rem]">
          <input
            (input)="onTagLineInput($event)"
            [disabled]="busy()"
            [value]="tagLine()"
            autocomplete="off"
            class="h-full w-full bg-transparent px-3 text-sm text-text-primary focus:outline-none"
            maxlength="16"
            required
            type="text"
          />
        </div>
      </div>
    </label>

    @if (!editedPlayer()) {
      <!-- Only on creation: an existing player's status is changed from its own row, so offering
           it here too would give the same state two owners. -->
      <fieldset>
        <legend class="tracking-label font-mono text-xs text-text-muted uppercase">
          {{ 'admin.players.form.status' | translate }}
        </legend>
        <div class="mt-2 flex gap-2">
          @for (candidate of ['ACTIVE', 'INACTIVE']; track candidate) {
            <button
              (click)="onStatusChange($any(candidate))"
              [attr.aria-pressed]="status() === candidate"
              [class]="
                status() === candidate
                  ? 'border-brand-500/60 bg-brand-500/15 text-brand-400'
                  : 'border-surface-600 text-text-secondary hover:border-surface-600/80 hover:text-text-primary'
              "
              class="notch-tr notch-tr-edge focus-ring-inset tracking-label flex min-h-10 cursor-pointer items-center border px-4 font-mono text-xs font-semibold uppercase transition-colors [--notch:0.375rem] motion-safe:active:scale-[0.96]"
              type="button"
            >
              {{ 'admin.players.status.' + candidate | translate }}
            </button>
          }
        </div>
      </fieldset>
    }

    <div class="mt-auto flex flex-wrap justify-end gap-3">
      <button
        appButton="ghost"
        (click)="close()"
        [disabled]="busy()"
        class="flex min-h-10 items-center px-4 py-2 text-sm font-semibold [--notch:0.5rem]"
        type="button"
      >
        {{ 'admin.cancel' | translate }}
      </button>
      <button
        appButton="primary"
        [disabled]="busy() || !valid()"
        class="flex min-h-10 items-center px-4 py-2 text-sm font-medium [--notch:0.5rem]"
        type="submit"
      >
        {{ 'admin.save' | translate }}
      </button>
    </div>
  </form>
</dialog>
