<app-drawer
  #drawer
  (closed)="closed.emit()"
  [closeLabel]="'admin.cancel' | translate"
  labelledBy="player-form-title"
>
  <h2
    class="font-display text-xl leading-none font-bold text-text-primary uppercase"
    drawerLeading
    id="player-form-title"
  >
    {{
      (editedPlayer() ? 'admin.players.form.editHeading' : 'admin.players.form.createHeading')
        | translate
    }}
  </h2>

  <form (submit)="submit($event)" class="flex flex-1 flex-col gap-6">
    <app-text-field [label]="'admin.players.form.gameName' | translate">
      <input
        appTextFieldInput
        (input)="onGameNameInput($event)"
        [disabled]="busy()"
        [value]="gameName()"
        autocomplete="off"
        maxlength="32"
        required
        type="text"
      />
    </app-text-field>

    <app-text-field [label]="'admin.players.form.tagLine' | translate">
      <input
        appTextFieldInput
        (input)="onTagLineInput($event)"
        [disabled]="busy()"
        [value]="tagLine()"
        autocomplete="off"
        maxlength="16"
        required
        type="text"
      />
    </app-text-field>

    <!-- Avatar association, offered on creation as on edit: the portrait is chosen by hand, no
         synchronization step resolves it. -->
    <div>
      <p class="label-caption text-text-muted">
        {{ 'admin.players.form.portrait' | translate }}
      </p>
      <div class="mt-2 flex items-center gap-3">
        <app-avatar [src]="portraitPreview()" size="sm" />
        <app-select
          [ariaLabel]="'admin.players.form.portrait' | translate"
          [disabled]="busy()"
          [options]="portraitOptions()"
          [value]="portrait()"
          (valueChange)="onPortraitChange($event)"
          class="min-w-0 flex-1"
        />
      </div>
    </div>

    @if (!editedPlayer()) {
      <!-- Only on creation: an existing player's status is changed from its own row, so offering
           it here too would give the same state two owners. -->
      <fieldset>
        <legend class="label-caption text-text-muted">
          {{ 'admin.players.form.status' | translate }}
        </legend>
        <div class="mt-2 flex gap-2">
          @for (candidate of ['ACTIVE', 'INACTIVE']; track candidate) {
            <button
              (click)="onStatusChange($any(candidate))"
              [attr.aria-pressed]="status() === candidate"
              [class]="
                status() === candidate
                  ? 'border-brand-500/60 bg-brand-500/15 text-brand-400'
                  : 'border-surface-600 text-text-secondary hover:border-surface-600/80 hover:text-text-primary'
              "
              class="notch-tr notch-tr-edge focus-ring-inset label-caption flex min-h-10 cursor-pointer items-center border px-4 font-semibold transition-colors [--notch:0.375rem] motion-safe:active:scale-[0.96]"
              type="button"
            >
              {{ 'admin.players.status.' + candidate | translate }}
            </button>
          }
        </div>
      </fieldset>
    }

    <div class="mt-auto flex flex-wrap justify-end gap-3">
      <button
        appButton="ghost"
        (click)="drawer.close()"
        [disabled]="busy()"
        class="flex min-h-10 items-center px-4 py-2 text-sm font-semibold [--notch:0.5rem]"
        type="button"
      >
        {{ 'admin.cancel' | translate }}
      </button>
      <button
        appButton="primary"
        [disabled]="busy() || !valid()"
        class="flex min-h-10 items-center px-4 py-2 text-sm font-medium [--notch:0.5rem]"
        type="submit"
      >
        {{ 'admin.save' | translate }}
      </button>
    </div>
  </form>
</app-drawer>
