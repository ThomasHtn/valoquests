<app-drawer
  #drawer
  (closed)="closed.emit()"
  [closeLabel]="'admin.cancel' | translate"
  labelledBy="player-form-title"
>
  <h2 class="player-form-panel__title" drawerLeading id="player-form-title">
    {{ headingKey() | translate }}
  </h2>

  <form (submit)="submit($event)" class="flex flex-1 flex-col gap-6">
    <app-text-field [label]="'admin.players.form.gameName' | translate">
      <input
        appTextFieldInput
        (input)="onGameNameInput($event)"
        [disabled]="busy()"
        [value]="gameName()"
        autocomplete="off"
        maxlength="32"
        required
        type="text"
      />
    </app-text-field>

    <app-text-field [label]="'admin.players.form.tagLine' | translate">
      <input
        appTextFieldInput
        (input)="onTagLineInput($event)"
        [disabled]="busy()"
        [value]="tagLine()"
        autocomplete="off"
        maxlength="16"
        required
        type="text"
      />
    </app-text-field>

    <!-- Portrait is chosen by hand; no synchronization resolves it. -->
    <div>
      <p class="player-form-panel__label label-caption">
        {{ 'admin.players.form.portrait' | translate }}
      </p>
      <div class="mt-2 flex items-center gap-3">
        <app-avatar [src]="portraitPreview()" size="sm" />
        <app-select
          [ariaLabel]="'admin.players.form.portrait' | translate"
          [disabled]="busy()"
          [options]="portraitOptions()"
          [value]="portrait()"
          (valueChange)="onPortraitChange($event)"
          class="min-w-0 flex-1"
        />
      </div>
    </div>

    @if (!editedPlayer()) {
      <!-- Creation only: an existing player's status is changed from its row. -->
      <fieldset>
        <legend class="player-form-panel__label label-caption">
          {{ 'admin.players.form.status' | translate }}
        </legend>
        <div class="mt-2 flex gap-2">
          @for (candidate of initialStatuses; track candidate) {
            <button
              (click)="onStatusChange(candidate)"
              [attr.aria-pressed]="status() === candidate"
              [class.player-form-panel__status-option--selected]="status() === candidate"
              class="player-form-panel__status-option notch-tr notch-tr-edge focus-ring-inset label-caption press"
              type="button"
            >
              {{ 'admin.players.status.' + candidate | translate }}
            </button>
          }
        </div>
      </fieldset>
    }

    <div class="mt-auto flex flex-wrap justify-end gap-3">
      <button
        appButton="ghost"
        (click)="drawer.close()"
        [disabled]="busy()"
        class="player-form-panel__cancel"
        type="button"
      >
        {{ 'admin.cancel' | translate }}
      </button>
      <button
        appButton="primary"
        [disabled]="busy() || !valid()"
        class="player-form-panel__save"
        type="submit"
      >
        @if (busy()) {
          <app-spinner />
        }
        {{ 'admin.save' | translate }}
      </button>
    </div>
  </form>
</app-drawer>
