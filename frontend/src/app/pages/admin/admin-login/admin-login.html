<!-- Outer panel notched at 1.25rem; the field and buttons inside step down to 0.5rem so the nested
     corners read as concentric rather than pinched. -->
<div
  class="notch-tr notch-tr-edge w-full max-w-md border border-brand-500/30 bg-surface-panel p-8 [--notch:1.25rem]"
>
  <span
    aria-hidden="true"
    class="clip-hex flex h-12 w-11 shrink-0 items-center justify-center bg-brand-500/12 text-brand-500"
  >
    <svg class="h-5 w-5" lucideLockKeyhole></svg>
  </span>

  <p class="tracking-label-wide mt-6 font-mono text-xs font-medium text-brand-500 uppercase">
    {{ 'admin.login.eyebrow' | translate }}
  </p>

  <h1
    class="font-display mt-2 text-2xl leading-none font-bold text-balance text-text-primary uppercase"
  >
    {{ 'admin.login.heading' | translate }}
  </h1>

  <form (submit)="submit($event)" class="mt-6">
    <label class="block">
      <span class="tracking-label block font-mono text-xs text-text-muted uppercase">
        {{ 'admin.login.keyLabel' | translate }}
      </span>
      <!-- The border lives as a `background-color` on this wrapping `div`, one `--notch` cut behind
           an inner `div` cut to the same shape but inset by its `p-px` padding: the sliver of the
           outer shape left showing around the inner one is the "border". Two nested clip-paths of
           the same polygon, rather than a real `border` plus a rotated line standing in for the cut
           corner (which a replaced element like `<input>` can't render via `::after` anyway),
           because that line and the clip-path are two independently anti-aliased shapes trying to
           land on the same pixel, and left a hairline gap at the tip. -->
      <div
        class="notch-tr mt-2 h-11 bg-text-muted p-px transition-colors [--notch:0.5rem] focus-within:bg-brand-500 has-[:disabled]:opacity-60"
      >
        <div class="notch-tr flex h-full items-center bg-surface-sunken [--notch:0.5rem]">
          <input
            (input)="onKeyInput($event)"
            [attr.aria-invalid]="error() ? 'true' : null"
            [disabled]="verifying()"
            [type]="showKey() ? 'text' : 'password'"
            [value]="key()"
            autocapitalize="off"
            autocomplete="current-password"
            class="h-full min-w-0 flex-1 bg-transparent px-3 font-mono text-sm text-text-primary placeholder:text-text-muted focus:outline-none"
            spellcheck="false"
          />
          <button
            (click)="toggleShowKey()"
            [attr.aria-label]="
              (showKey() ? 'admin.login.hideKey' : 'admin.login.showKey') | translate
            "
            [attr.aria-pressed]="showKey()"
            class="focus-ring flex h-full w-11 shrink-0 cursor-pointer items-center justify-center text-text-muted transition-colors hover:text-text-primary"
            type="button"
          >
            @if (showKey()) {
              <svg aria-hidden="true" class="h-4 w-4" lucideEyeOff></svg>
            } @else {
              <svg aria-hidden="true" class="h-4 w-4" lucideEye></svg>
            }
          </button>
        </div>
      </div>
    </label>

    @if (error()) {
      <!-- The icon carries the failure as much as the colour does, so the message still reads as a
           failure without colour perception. -->
      <p class="mt-3 flex items-start gap-2 text-xs text-danger" role="alert">
        <svg aria-hidden="true" class="mt-px h-4 w-4 shrink-0" lucideTriangleAlert></svg>
        <span class="min-w-0 text-pretty">{{ error() }}</span>
      </p>
    }

    <button
      appButton="primary"
      [disabled]="verifying() || key().trim() === ''"
      class="mt-6 flex min-h-11 w-full items-center justify-center gap-2 px-4 py-2 text-sm font-medium [--notch:0.5rem]"
      type="submit"
    >
      @if (verifying()) {
        <svg
          aria-hidden="true"
          class="h-4 w-4 shrink-0 motion-safe:animate-spin"
          lucideLoaderCircle
        ></svg>
      }
      {{ 'admin.login.submit' | translate }}
    </button>
  </form>
</div>
