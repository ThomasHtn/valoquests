<!-- Wordmark, same gradient as the landing page. -->
<p class="admin-login__wordmark">
  <span class="admin-login__wordmark-text">ValoQuests</span>
</p>

<!-- Inner notches step down to 0.5rem so nested corners read as concentric. -->
<div class="admin-login__card notch-tr notch-tr-edge">
  <span aria-hidden="true" class="admin-login__emblem clip-hex">
    <svg class="size-7" lucideLockKeyhole></svg>
  </span>

  <p class="admin-login__eyebrow">{{ 'admin.login.eyebrow' | translate }}</p>

  <h1 class="admin-login__heading">{{ 'admin.login.heading' | translate }}</h1>

  <!-- What signing in lets the reader do. -->
  <p class="admin-login__hint">{{ 'admin.login.keyHint' | translate }}</p>

  <form (submit)="submit($event)" class="mt-6">
    <app-text-field [label]="'admin.login.keyLabel' | translate">
      <input
        appTextFieldInput
        (input)="onKeyInput($event)"
        [attr.aria-invalid]="error() ? 'true' : null"
        [disabled]="verifying()"
        [type]="showKey() ? 'text' : 'password'"
        [value]="key()"
        autocapitalize="off"
        autocomplete="current-password"
        spellcheck="false"
      />
      <button
        (click)="toggleShowKey()"
        [attr.aria-label]="(showKey() ? 'admin.login.hideKey' : 'admin.login.showKey') | translate"
        [attr.aria-pressed]="showKey()"
        class="admin-login__key-toggle focus-ring"
        type="button"
      >
        @if (showKey()) {
          <svg aria-hidden="true" class="size-4" lucideEyeOff></svg>
        } @else {
          <svg aria-hidden="true" class="size-4" lucideEye></svg>
        }
      </button>
    </app-text-field>

    <button appButton="primary" [disabled]="!canSubmit()" class="admin-login__submit" type="submit">
      @if (verifying()) {
        <app-spinner />
      }
      {{ 'admin.login.submit' | translate }}
    </button>
  </form>
</div>

<!-- Way out to the public site, styled as a back link rather than an action. -->
<a [routerLink]="'/overview'" class="admin-login__back-link focus-ring">
  <svg aria-hidden="true" class="size-3.5 shrink-0" lucideChevronLeft></svg>
  {{ 'admin.login.backToSite' | translate }}
</a>
