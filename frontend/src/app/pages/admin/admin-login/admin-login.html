<!-- Outer panel notched at 1.25rem; the field and buttons inside step down to 0.5rem so the nested
     corners read as concentric rather than pinched. -->
<div
  class="notch-tr notch-tr-edge w-full max-w-md border border-brand-500/30 bg-surface-sunken p-8 [--notch:1.25rem]"
>
  <span
    aria-hidden="true"
    class="clip-hex mx-auto flex h-16 w-14 shrink-0 items-center justify-center bg-brand-500/12 text-brand-500"
  >
    <svg class="h-7 w-7" lucideLockKeyhole></svg>
  </span>

  <p class="tracking-label-wide mt-6 font-mono text-xs font-medium text-brand-500 uppercase">
    {{ 'admin.login.eyebrow' | translate }}
  </p>

  <h1
    class="font-display mt-2 text-2xl leading-none font-bold text-balance text-text-primary uppercase"
  >
    {{ 'admin.login.heading' | translate }}
  </h1>

  <form (submit)="submit($event)" class="mt-6">
    <app-text-field [label]="'admin.login.keyLabel' | translate">
      <input
        appTextFieldInput
        (input)="onKeyInput($event)"
        [attr.aria-invalid]="error() ? 'true' : null"
        [disabled]="verifying()"
        [type]="showKey() ? 'text' : 'password'"
        [value]="key()"
        autocapitalize="off"
        autocomplete="current-password"
        spellcheck="false"
      />
      <button
        (click)="toggleShowKey()"
        [attr.aria-label]="(showKey() ? 'admin.login.hideKey' : 'admin.login.showKey') | translate"
        [attr.aria-pressed]="showKey()"
        class="focus-ring flex h-full w-11 shrink-0 cursor-pointer items-center justify-center text-text-muted transition-colors hover:text-text-primary"
        type="button"
      >
        @if (showKey()) {
          <svg aria-hidden="true" class="h-4 w-4" lucideEyeOff></svg>
        } @else {
          <svg aria-hidden="true" class="h-4 w-4" lucideEye></svg>
        }
      </button>
    </app-text-field>

    <button
      appButton="primary"
      [disabled]="verifying() || key().trim() === ''"
      class="mt-6 flex min-h-11 w-full items-center justify-center gap-2 px-4 py-2 text-base font-semibold [--notch:0.5rem]"
      type="submit"
    >
      @if (verifying()) {
        <svg
          aria-hidden="true"
          class="h-4 w-4 shrink-0 motion-safe:animate-spin"
          lucideLoaderCircle
        ></svg>
      }
      {{ 'admin.login.submit' | translate }}
    </button>
  </form>
</div>
