<!-- Outer panel notched at 1.25rem; the field and buttons inside step down to 0.5rem so the nested
     corners read as concentric rather than pinched. -->
<div
  class="notch-tr notch-tr-edge w-full max-w-md border border-brand-500/30 bg-surface-900/70 p-8 [--notch:1.25rem]"
>
  <span
    aria-hidden="true"
    class="clip-hex flex h-12 w-11 shrink-0 items-center justify-center bg-brand-500/12 text-brand-500"
  >
    <svg class="h-5 w-5" lucideLockKeyhole></svg>
  </span>

  <p class="tracking-label-wide mt-6 font-mono text-xs font-medium text-brand-500 uppercase">
    {{ 'admin.login.eyebrow' | translate }}
  </p>

  <h1
    class="font-display mt-2 text-2xl leading-none font-bold text-balance text-text-primary uppercase"
  >
    {{ 'admin.login.heading' | translate }}
  </h1>

  <form (submit)="submit($event)" class="mt-6">
    <label class="block">
      <span class="tracking-label block font-mono text-xs text-text-muted uppercase">
        {{ 'admin.login.keyLabel' | translate }}
      </span>
      <!-- `notch-tr-edge` needs an element that actually renders `::after`: a replaced element like
           `<input>` never does, whatever browser draws it, so the border and the notch live on this
           wrapping `div` instead and the field itself sits inside it as a plain, borderless child. -->
      <div
        class="notch-tr notch-tr-edge mt-2 flex h-11 items-center border border-surface-600 bg-surface-950 transition-colors [--notch:0.5rem] focus-within:border-brand-500/60 has-[:disabled]:opacity-60"
      >
        <input
          (input)="onKeyInput($event)"
          [attr.aria-invalid]="error() ? 'true' : null"
          [disabled]="verifying()"
          [type]="showKey() ? 'text' : 'password'"
          [value]="key()"
          autocapitalize="off"
          autocomplete="current-password"
          class="focus-ring-inset h-full min-w-0 flex-1 bg-transparent px-3 font-mono text-sm text-text-primary placeholder:text-text-muted"
          spellcheck="false"
        />
        <button
          (click)="toggleShowKey()"
          [attr.aria-label]="
            (showKey() ? 'admin.login.hideKey' : 'admin.login.showKey') | translate
          "
          [attr.aria-pressed]="showKey()"
          class="focus-ring flex h-full w-11 shrink-0 cursor-pointer items-center justify-center text-text-muted transition-colors hover:text-text-primary"
          type="button"
        >
          @if (showKey()) {
            <svg aria-hidden="true" class="h-4 w-4" lucideEyeOff></svg>
          } @else {
            <svg aria-hidden="true" class="h-4 w-4" lucideEye></svg>
          }
        </button>
      </div>
    </label>

    @if (error()) {
      <!-- The icon carries the failure as much as the colour does, so the message still reads as a
           failure without colour perception. -->
      <p class="mt-3 flex items-start gap-2 text-xs text-danger" role="alert">
        <svg aria-hidden="true" class="mt-px h-4 w-4 shrink-0" lucideTriangleAlert></svg>
        <span class="min-w-0 text-pretty">{{ error() }}</span>
      </p>
    }

    <button
      [disabled]="verifying() || key().trim() === ''"
      class="notch-tr focus-ring-inset mt-6 flex min-h-11 w-full cursor-pointer items-center justify-center gap-2 bg-brand-500 px-4 py-2 text-sm font-medium text-surface-950 transition-colors [--notch:0.5rem] hover:bg-brand-400 disabled:cursor-not-allowed disabled:opacity-50 motion-safe:active:scale-[0.96]"
      type="submit"
    >
      @if (verifying()) {
        <svg
          aria-hidden="true"
          class="h-4 w-4 shrink-0 motion-safe:animate-spin"
          lucideLoaderCircle
        ></svg>
      }
      {{ 'admin.login.submit' | translate }}
    </button>
  </form>
</div>
