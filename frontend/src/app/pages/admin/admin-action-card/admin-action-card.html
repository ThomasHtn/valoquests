<div class="notch-tr flex h-full flex-col bg-text-primary/4 p-5 [--notch:0.875rem]">
  <h2 class="tracking-label font-display text-base font-bold text-text-primary uppercase">
    {{ heading() }}
  </h2>

  <p class="mt-2 flex-1 text-base text-pretty text-text-secondary">{{ description() }}</p>

  <!-- Content is projected next to the button, for the operations that need a parameter picked
       before they can run. -->
  <div class="mt-4 flex flex-wrap items-end gap-3">
    <ng-content />

    <button
      (click)="triggered.emit()"
      [class]="
        destructive()
          ? 'bg-danger text-surface-950 hover:bg-danger/90'
          : 'bg-brand-500 text-surface-950 hover:bg-brand-400'
      "
      [disabled]="disabled() || state().status === 'running'"
      class="notch-tr focus-ring-inset ml-auto flex min-h-10 w-36 cursor-pointer items-center justify-center gap-2 px-4 py-2 text-sm font-medium transition-colors [--notch:0.5rem] disabled:cursor-not-allowed disabled:opacity-50 motion-safe:active:scale-[0.96]"
      type="button"
    >
      @if (state().status === 'running') {
        <svg
          aria-hidden="true"
          class="h-4 w-4 shrink-0 motion-safe:animate-spin"
          lucideLoaderCircle
        ></svg>
      }
      {{ actionLabel() }}
    </button>
  </div>

  @if (state().status === 'done' || state().status === 'error') {
    <!-- Colour is never the only cue: each outcome carries its own icon and its own sentence, so
         the answer survives both a colour-blind reader and a screen reader. -->
    <p
      [class]="state().status === 'error' ? 'text-danger' : 'text-success'"
      class="mt-3 flex items-start gap-2 text-xs"
      role="status"
    >
      @if (state().status === 'error') {
        <svg aria-hidden="true" class="mt-px h-4 w-4 shrink-0" lucideTriangleAlert></svg>
      } @else {
        <svg aria-hidden="true" class="mt-px h-4 w-4 shrink-0" lucideCircleCheck></svg>
      }
      <span class="min-w-0 text-pretty">{{ state().message }}</span>
    </p>
  }
</div>
