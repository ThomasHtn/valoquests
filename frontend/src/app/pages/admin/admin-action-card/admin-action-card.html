<div class="notch-tr flex h-full flex-col bg-text-primary/4 p-5 [--notch:0.875rem]">
  <h2 class="tracking-label font-display text-base font-bold text-text-primary uppercase">
    {{ heading() }}
  </h2>

  <p class="mt-2 flex-1 text-base text-pretty text-text-secondary">{{ description() }}</p>

  <!-- Content is projected next to the button, for the operations that need a parameter picked
       before they can run. -->
  <div class="mt-4 flex flex-wrap items-end gap-3">
    <ng-content />

    <button
      [appButton]="destructive() ? 'danger' : 'primary'"
      (click)="triggered.emit()"
      [disabled]="disabled() || state().status === 'running'"
      class="ml-auto flex min-h-10 w-36 items-center justify-center gap-2 px-4 py-2 text-sm font-medium [--notch:0.5rem]"
      type="button"
    >
      @if (state().status === 'running') {
        <svg
          aria-hidden="true"
          class="h-4 w-4 shrink-0 motion-safe:animate-spin"
          lucideLoaderCircle
        ></svg>
      }
      {{ actionLabel() }}
    </button>
  </div>
</div>
