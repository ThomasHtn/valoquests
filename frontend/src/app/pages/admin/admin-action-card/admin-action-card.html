<div class="admin-action-card notch-tr panel">
  <h2 class="admin-action-card__heading">{{ heading() }}</h2>

  <p class="admin-action-card__description">{{ description() }}</p>

  <!-- Projected parameters, picked before the operation runs. -->
  <div class="mt-4 flex flex-wrap items-end gap-3">
    <ng-content />

    <button
      [appButton]="buttonVariant()"
      (click)="triggered.emit()"
      [disabled]="disabled() || running()"
      class="admin-action-card__button"
      type="button"
    >
      @if (running()) {
        <app-spinner />
      }
      {{ actionLabel() }}
    </button>
  </div>
</div>
