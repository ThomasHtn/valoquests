<button
  (click)="step(1)"
  [attr.aria-label]="'leaderboard.nav.previous' | translate"
  [disabled]="!canGoBack()"
  class="week-picker__step focus-ring-inset"
  type="button"
>
  <svg aria-hidden="true" class="size-4" lucideChevronLeft></svg>
</button>

<!-- Select-only combobox: focus stays here, `aria-activedescendant` tracks the highlight. -->
<button
  #trigger
  (click)="toggle()"
  (keydown)="onKeydown($event)"
  [attr.aria-activedescendant]="activeOptionId()"
  [attr.aria-controls]="listboxId"
  [attr.aria-expanded]="isOpen()"
  [attr.aria-label]="'leaderboard.nav.choose' | translate"
  aria-haspopup="listbox"
  class="week-picker__trigger notch-tr focus-ring-inset"
  role="combobox"
  type="button"
>
  @if (current(); as current) {
    <ng-container
      [ngTemplateOutlet]="weekMark"
      [ngTemplateOutletContext]="{ $implicit: current }"
    />
    <span class="week-picker__trigger-label">{{ current.label }}</span>
    @if (current.live) {
      <span class="week-picker__live label-caption text-2xs">{{
        'leaderboard.nav.live' | translate
      }}</span>
    }
  }
  <svg
    [class.week-picker__chevron--open]="isOpen()"
    aria-hidden="true"
    class="week-picker__chevron"
    lucideChevronDown
  ></svg>
</button>

<button
  (click)="step(-1)"
  [attr.aria-label]="'leaderboard.nav.next' | translate"
  [disabled]="!canGoForward()"
  class="week-picker__step focus-ring-inset"
  type="button"
>
  <svg aria-hidden="true" class="size-4" lucideChevronRight></svg>
</button>

<!-- Runs of weeks are ruled off, not named: the badge says the campaign. -->
<div
  #panel
  (keydown)="onKeydown($event)"
  [attr.aria-label]="'leaderboard.nav.choose' | translate"
  [hidden]="!isOpen()"
  [id]="listboxId"
  class="week-picker__listbox menu-panel"
  role="listbox"
  tabindex="-1"
>
  <div class="week-picker__scroll">
    @for (option of options(); track option.weekStart) {
      @if (startsGroup($index)) {
        <hr aria-hidden="true" class="week-picker__rule" />
      }
      <!-- Keyboard highlight wears the hover tint; options stay out of the tab order. -->
      <button
        (click)="select(option)"
        [attr.aria-selected]="option.weekStart === selected()"
        [attr.data-active]="$index === activeIndex() || null"
        [class.week-picker__option--selected]="option.weekStart === selected()"
        [id]="optionId($index)"
        class="week-picker__option menu-option focus-ring-inset"
        role="option"
        tabindex="-1"
        type="button"
      >
        <ng-container
          [ngTemplateOutlet]="weekMark"
          [ngTemplateOutletContext]="{ $implicit: option }"
        />
        <span class="week-picker__option-label">{{ option.label }}</span>
        <!-- Winner in its own column so portraits line up. -->
        <span class="week-picker__winner">
          @if (option.live) {
            <span class="week-picker__live label-caption text-2xs">{{
              'leaderboard.nav.live' | translate
            }}</span>
          } @else if (option.winner; as winner) {
            <app-avatar [src]="winner.portrait" size="xs" />
            <span class="week-picker__winner-name">{{ winner.name }}</span>
          }
        </span>
      </button>
    }
  </div>
</div>

<ng-template #weekMark let-option>
  @if (option.index !== null) {
    <span class="week-picker__mark">
      <span class="sr-only">{{
        'leaderboard.nav.weekIndex' | translate: { week: option.index }
      }}</span>
      <span aria-hidden="true">{{
        'leaderboard.nav.weekShort' | translate: { week: option.index }
      }}</span>
    </span>
  } @else {
    <span aria-hidden="true" class="week-picker__mark week-picker__mark--none">—</span>
  }
</ng-template>
