<div class="sky">
  <svg
    #sky
    aria-hidden="true"
    class="stars"
    preserveAspectRatio="xMidYMax slice"
    viewBox="0 0 1600 280"
  ></svg>

  <!-- 1st rendered larger and centred via `order`, so the DOM keeps its reading order (1st, 2nd,
       3rd) for assistive technology while the layout reads as a podium. -->
  <ol [attr.aria-label]="'leaderboard.podium.label' | translate" class="plinths">
    @for (row of top(); track row.playerId) {
      <li [class]="'place place--' + row.position">
        <a [routerLink]="['/players', row.playerId]" class="focus-ring link">
          <app-avatar
            [champion]="row.isChampion"
            [priority]="row.position === 1"
            [size]="row.position === 1 ? 'md' : 'sm'"
            [src]="row.portrait"
          />

          <span class="name">
            {{ row.name }}
            @if (row.isChampion) {
              <app-champion-badge />
            }
          </span>

          <span class="plinth">
            <span aria-hidden="true" class="plate tabular-nums">{{ row.position }}</span>
            <span class="sr-only">
              {{ 'leaderboard.podium.rank.' + row.position | translate }}
            </span>
          </span>
        </a>
      </li>
    }
  </ol>
</div>
