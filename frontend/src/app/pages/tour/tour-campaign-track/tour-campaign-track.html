<div class="flex items-baseline justify-between gap-4">
  <p class="tour-campaign-track__week">
    {{ 'tour.track.week' | translate }}
    <span class="tour-campaign-track__week-index">{{ weekIndex() }}</span>
    {{ 'tour.track.total' | translate: { total: weekCount } }}
  </p>
  <p class="tour-campaign-track__stages">
    <svg class="tour-campaign-track__stages-icon" lucideRocket></svg>
    {{ 'tour.track.stages' | translate: { done: stagesDone(), total: stageCount } }}
  </p>
</div>

<!-- The line behind is solid up to the current planet. -->
<ol [style.--done]="doneWidth()" class="tour-campaign-track__planets mt-3">
  @for (planet of planets(); track planet.weekIndex) {
    <li
      [class]="'tour-campaign-track__planet--' + planet.state"
      class="tour-campaign-track__planet"
    >
      <span class="tour-campaign-track__orb">
        <img [ngSrc]="planet.art" alt="" class="tour-campaign-track__art" fill />
      </span>
      <span class="tour-campaign-track__label">{{ planet.label }}</span>
    </li>
  }
</ol>
