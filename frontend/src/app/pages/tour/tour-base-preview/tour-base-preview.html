<div class="tour-base-preview">
  <!-- Hidden: assistive technology gets the sliders' own values. -->
  <div aria-hidden="true" class="tour-base-preview__scene">
    <app-base-scene
      [fullCampaignPopulation]="fullCampaignPopulation()"
      [population]="shownPopulation()"
      [stagesDone]="shownStages()"
      class="block"
    />
    <div class="tour-base-preview__wash"></div>
    <div class="tour-base-preview__readout">
      <p class="tour-base-preview__population">
        <span [appCountUp]="shownPopulation()" class="tabular-nums"></span>
        <span class="tour-base-preview__unit">{{ 'overview.scene.unit' | translate }}</span>
      </p>
    </div>
  </div>

  <div class="tour-base-preview__controls">
    <label class="tour-base-preview__slider">
      <span class="tour-base-preview__slider-head">
        <span class="tour-base-preview__slider-name label-caption">
          <svg class="tour-base-preview__slider-icon" lucideUsers></svg>
          {{ 'tour.preview.population' | translate }}
        </span>
        <span class="tour-base-preview__slider-value">{{ format(shownPopulation()) }}</span>
      </span>
      <input
        (input)="onPopulation($event)"
        [max]="fullCampaignPopulation()"
        [min]="minPopulation"
        [step]="populationStep"
        [style.--fill]="populationFill()"
        [value]="shownPopulation()"
        class="tour-base-preview__slider-input"
        type="range"
      />
    </label>

    <label class="tour-base-preview__slider">
      <span class="tour-base-preview__slider-head">
        <span class="tour-base-preview__slider-name label-caption">
          <svg class="tour-base-preview__slider-icon" lucideRocket></svg>
          {{ 'tour.preview.stages' | translate }}
        </span>
        <span class="tour-base-preview__slider-value">
          {{ 'tour.preview.stagesValue' | translate: { done: shownStages(), total: stageCount } }}
        </span>
      </span>
      <input
        (input)="onStages($event)"
        [max]="stageCount"
        [min]="0"
        [step]="1"
        [style.--fill]="stagesFill()"
        [value]="shownStages()"
        class="tour-base-preview__slider-input"
        type="range"
      />
    </label>
  </div>
</div>
