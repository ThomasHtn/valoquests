<!-- The squad as a wrapping row of cards rather than as a table: the tour is establishing that the
     group exists and that each member carries a rank, not comparing their statistics. Cards are cut
     at the top-right like every other panel in the application. -->
<app-resource-state
  (retry)="reload()"
  [emptyText]="'players.empty' | translate"
  [errorText]="'players.error' | translate"
  [isEmpty]="cards().length === 0"
  [isError]="hasError()"
  [isLoading]="isLoading()"
  [loadingText]="'players.loading' | translate"
  padding="py-6"
>
  <ul class="flex flex-wrap justify-center gap-3">
    @for (card of cards(); track card.id) {
      <li
        class="notch-tr notch-tr-edge flex w-40 flex-col items-center gap-2.5 border border-text-primary/10 bg-text-primary/4 px-3 py-5 [--notch:0.75rem]"
      >
        <!-- Hexagon silhouette, the application's marker for a player who holds a rank. -->
        <app-avatar [src]="card.avatarUrl" size="md" />

        <p class="font-display max-w-full truncate text-lg leading-tight font-semibold">
          {{ card.displayName }}
        </p>

        <div class="flex items-center gap-1.5">
          <app-rank-icon-view [src]="card.rankIconUrl" [tierLabel]="card.tier.label" size="sm" />
          <span
            [class]="card.tier.colorClass"
            class="tracking-label max-w-full truncate font-mono text-xs font-medium uppercase"
          >
            {{ card.tier.label }}
          </span>
        </div>
      </li>
    }
  </ul>
</app-resource-state>
