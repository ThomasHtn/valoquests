<!-- On a phone the context bar is the only way back into the navigation. -->
<app-page-header [heading]="'notFound.title' | translate" />

<div class="page-body">
  <section class="not-found__content resource-settle">
    <app-empty-plate [plate]="plate()" class="not-found__plate" />
    <a appButton="primary" class="not-found__home-link" routerLink="/overview">
      <svg aria-hidden="true" class="size-4 shrink-0" lucideLayoutDashboard></svg>
      {{ 'notFound.backToOverview' | translate }}
    </a>
  </section>
</div>
