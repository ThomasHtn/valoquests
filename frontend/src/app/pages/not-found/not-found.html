<!-- Context bar, like every other page nested under the shell: a dead end still has to say where it
     is, and on a phone it is the only way back into the navigation. -->
<app-page-header [heading]="'notFound.title' | translate" eyebrow="404" />

<div class="page-body">
  <section class="flex min-h-[50vh] flex-col items-start justify-center">
    <p class="max-w-prose text-lead text-text-secondary">
      {{ 'notFound.description' | translate }}
    </p>
    <a
      class="focus-ring tracking-label mt-6 inline-flex h-12 items-center border border-edge px-4 font-mono text-xs font-medium text-text-muted uppercase transition-colors hover:bg-brand-500/8 hover:text-text-primary motion-safe:active:scale-[0.96]"
      routerLink="/overview"
    >
      {{ 'notFound.backToOverview' | translate }}
    </a>
  </section>
</div>
