<!-- Context bar, like every other page nested under the shell: a dead end still has to say where it
     is, and on a phone it is the only way back into the navigation. -->
<app-page-header [heading]="'notFound.title' | translate" />

<div class="page-body">
  <!-- Told as an empty scan, in the idiom of the other empty screens, rather than as a bare line. -->
  <section
    class="resource-settle flex min-h-[60vh] flex-col items-center justify-center gap-6 py-6"
  >
    <app-empty-plate [plate]="plate()" />
    <a
      appButton="primary"
      class="inline-flex min-h-12 items-center gap-2 px-5 font-display text-sm font-semibold tracking-wide uppercase [--notch:0.625rem]"
      routerLink="/overview"
    >
      <svg aria-hidden="true" class="size-4 shrink-0" lucideLayoutDashboard></svg>
      {{ 'notFound.backToOverview' | translate }}
    </a>
  </section>
</div>
