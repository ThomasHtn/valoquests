<!-- Skip link (WCAG 2.4.1), visible only while focused. -->
<a
  class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 focus:z-50 focus:border focus:border-brand-500/45 focus:bg-surface-800 focus:px-4 focus:py-2 focus:text-sm focus:font-semibold focus:text-text-primary"
  (click)="skipToContent($event)"
  href="#main-content"
>
  {{ 'skipToContent' | translate }}
</a>

<!-- Sidebar is a column from `lg` up, a drawer over the page below it. -->
<div class="ambient-field flex h-dvh flex-col overflow-hidden bg-surface-950 lg:flex-row">
  <app-sidebar />

  <!-- Not the scroll container (`page-body` is); inert behind the open drawer to trap focus. -->
  <main
    #main
    [attr.inert]="navigationPanel.isOpen() && !breakpoint.isLarge() ? '' : null"
    class="relative flex-1 overflow-hidden"
    id="main-content"
    tabindex="-1"
  >
    <app-route-progress />
    <router-outlet />
    <app-scroll-top />
  </main>
</div>
