<!-- Bypass block (WCAG 2.4.1): the sidebar repeats on every route, so keyboard users get a way
     to jump straight to the routed content. Visible only while focused. -->
<a
  class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 focus:z-50 focus:border focus:border-brand-500/45 focus:bg-surface-800 focus:px-4 focus:py-2 focus:text-sm focus:font-semibold focus:text-text-primary"
  href="#main-content"
>
  {{ 'skipToContent' | translate }}
</a>

<!-- Navigation sits beside the content on desktop and above it on small screens, hence the direction
     switch: under `lg` the sidebar contributes a header bar that stacks over the routed content,
     and its panel becomes a drawer overlaying the page rather than a column beside it. -->
<div class="ambient-field flex h-screen flex-col overflow-hidden bg-surface-950 lg:flex-row">
  <!-- Persistent navigation, shown on every route nested under this shell. -->
  <app-sidebar />

  <!-- Routed page content. Capped in width so that on wide displays the eye is not dragged across
       the full viewport between a table's first and last column. `relative` gives a page a
       positioning context to anchor anything full-bleed against, bypassing this wrapper's padding
       and width cap. -->
  <main class="relative flex-1 overflow-y-auto" id="main-content" tabindex="-1">
    <div class="mx-auto w-full max-w-[1440px] p-4 sm:p-6">
      <router-outlet />
    </div>
  </main>
</div>
