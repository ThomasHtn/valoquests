<!-- Outside `page-body`, the scroll container, so it stays put without `sticky`. -->
<header class="page-header">
  <div class="page-header__bar">
    <!-- Only way into the navigation below `lg`; the margin keeps the 44px target aligned. -->
    <button
      #menuButton
      (click)="openNavigation()"
      [attr.aria-controls]="navigationPanel.panelId"
      [attr.aria-expanded]="navigationPanel.isOpen()"
      [attr.aria-label]="'sidebar.openMenu' | translate"
      class="page-header__menu-button focus-ring press"
      type="button"
    >
      <svg class="block size-6 shrink-0" lucideMenu></svg>
    </button>

    <div class="flex min-w-0 flex-1 items-center">
      @if (back(); as target) {
        <!-- History step when the previous page is nameable, else the parent. -->
        <div class="flex min-w-0 flex-1 items-center gap-2">
          @if (target.viaHistory) {
            <a
              (click)="goBack($event)"
              [attr.aria-label]="'pageHeader.back' | translate: { name: target.label }"
              [href]="target.link"
              class="page-header__back label-caption focus-ring"
            >
              <ng-container *ngTemplateOutlet="backContent; context: { $implicit: target }" />
            </a>
          } @else {
            <a
              [attr.aria-label]="'pageHeader.back' | translate: { name: target.label }"
              [routerLink]="target.link"
              class="page-header__back label-caption focus-ring"
            >
              <ng-container *ngTemplateOutlet="backContent; context: { $implicit: target }" />
            </a>
          }
          <ng-content select="[backAside]" />
        </div>
      } @else if (heading()) {
        <!-- One line, never wrapping: the bar keeps the same height on every page. -->
        <h1 class="page-header__title">{{ heading() }}</h1>
      }
    </div>

    <!-- Page actions; never shrinks, a long title truncates instead. -->
    <div class="flex shrink-0 items-center gap-2">
      <ng-content />
    </div>
  </div>
</header>

<ng-template #backContent let-target>
  <svg aria-hidden="true" class="page-header__back-icon" lucideChevronLeft></svg>
  <span class="truncate">{{ target.label }}</span>
</ng-template>
