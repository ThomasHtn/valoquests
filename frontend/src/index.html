<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <!-- Shown until the first route resolves, after which `TranslatedTitleStrategy` takes over.
         Must match its `APPLICATION_NAME`, which is what every resolved title is suffixed with. -->
    <title>Valorant Quests</title>
    <base href="/" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <link href="favicon.svg" rel="icon" type="image/svg+xml" />
    <link href="favicon.ico" rel="icon" type="image/x-icon" />
    <!-- Typefaces of the "Expédition" direction: Oswald for headings and the wordmark, Barlow
         Condensed for body copy, JetBrains Mono for the eyebrow and hint labels. -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
