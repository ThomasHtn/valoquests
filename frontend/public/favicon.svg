<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="badge" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#e8ab6b" />
      <stop offset="100%" stop-color="#a6752a" />
    </radialGradient>
  </defs>
  <!-- Hexagon badge — the same clip-hex silhouette used by challenge/rank badges across the app. -->
  <polygon
    points="32,1 62,16.5 62,47.5 32,63 2,47.5 2,16.5"
    fill="url(#badge)"
    stroke="#26190c"
    stroke-width="1.5"
    stroke-linejoin="miter"
  />
  <!-- Angular V mark (Valorant Quests), cut from the badge like the app's notched panels. -->
  <polygon points="14,16 32,50 50,16 41,16 32,34 23,16" fill="#0f1c26" />
</svg>
