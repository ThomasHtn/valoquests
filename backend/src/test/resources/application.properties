# =============================================================================
# Database
# =============================================================================
# In-memory H2 database configured to emulate PostgreSQL.
# NON_KEYWORDS=DAY: H2 reserves DAY where PostgreSQL does not, so the columns naming the
# calendar day of a challenge selection, a campaign day and an operator day would fail to be
# created here while the real schema accepts them.
spring.datasource.url=jdbc:h2:mem:valorant;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=DAY
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# Create and drop the schema for each test execution.
spring.jpa.hibernate.ddl-auto=create-drop
# Prevent database access during HTTP response serialization.
spring.jpa.open-in-view=false
# Store and read database timestamps in UTC.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Flyway is disabled because Hibernate generates the test schema.
spring.flyway.enabled=false
# =============================================================================
# JSON serialization
# =============================================================================
# Keep test serialization consistent with the main application.
spring.jackson.default-property-inclusion=always
spring.jackson.time-zone=UTC
# =============================================================================
# Application settings
# =============================================================================
# Test configuration used by integration tests.
app.frontend-origin=http://localhost:4200
app.admin-api-key=test-admin-key-0123456789abcdef0
# High budget so security tests exercising one or two invalid attempts never trip the lockout;
# AdminAuthRateLimiterTest and the dedicated lockout test in AdminApiKeyFilterTest override this.
app.admin-rate-limit.max-failures=1000000
app.admin-rate-limit.lockout-duration=PT1M
# Matches the production default, so the suite exercises the posture that actually ships.
app.api-docs-enabled=false
# =============================================================================
# Scheduling
# =============================================================================
# Disable automatic jobs during integration tests.
app.scheduling.standard-synchronization-enabled=false
app.scheduling.week-rollover-enabled=false
app.scheduling.campaign-tick-enabled=false
# Required placeholder values for scheduler configuration.
app.scheduling.standard-synchronization-cron=0 0 6,12,18 * * *
app.scheduling.week-rollover-cron=0 5 0 * * MON
app.scheduling.campaign-tick-cron=0 10 0 * * *
app.scheduling.zone=UTC
app.scheduling.week-rollover-zone=UTC
# =============================================================================
# Henrik API client
# =============================================================================
# Fake Henrik API configuration used during tests.
henrik.api.base-url=http://localhost
henrik.api.key=test-api-key
henrik.api.region=eu
henrik.api.platform=pc
# Short HTTP timeouts suitable for tests.
henrik.api.connect-timeout=PT2S
henrik.api.read-timeout=PT2S
# Disable retries unless a dedicated test configures them explicitly.
henrik.api.max-attempts=1
henrik.api.retry-delay=PT0.001S
henrik.api.rate-limit-max-attempts=1
# Use a very high limit to avoid slowing down tests.
henrik.api.requests-per-minute=60000
# No additional delay is required in tests.
henrik.api.rate-limit-safety-margin=PT0S
# =============================================================================
# Logging
# =============================================================================
# Keep test output readable while preserving warnings and errors.
logging.level.io.github.thomashtn.valoquests=INFO
# Expected synchronization failures are explicitly tested and do not need
# to print full stack traces during the test suite.
logging.level.io.github.thomashtn.valoquests.synchronization.service.DefaultSynchronizationCommandService=OFF
