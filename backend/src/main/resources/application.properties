# =============================================================================
# Application
# =============================================================================
spring.application.name=valo-quests
# AdminApiKeyFilter authenticates admins; this stops Boot from creating an unused in-memory user.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
# =============================================================================
# Database
# =============================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/valo_quests}
spring.datasource.username=${DB_USERNAME:valorant}
spring.datasource.password=${DB_PASSWORD:valorant}
# =============================================================================
# JPA and Hibernate
# =============================================================================
# Flyway owns the schema; Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=50
# =============================================================================
# Flyway
# =============================================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
# =============================================================================
# JSON serialization
# =============================================================================
# Nulls are written explicitly: the frontend types them as `| null`.
spring.jackson.default-property-inclusion=always
spring.jackson.time-zone=UTC
# =============================================================================
# HTTP server
# =============================================================================
server.shutdown=graceful
# Trusts X-Forwarded-* from the reverse proxy, so the admin lockout keys on the real caller.
# Safe only while the application is never reachable without that proxy.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:framework}
# =============================================================================
# Actuator
# =============================================================================
# Only what SecurityConfig opens; `metrics` would be public, so it stays off.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.version=@project.version@
# =============================================================================
# OpenAPI and Swagger UI
# =============================================================================
# Swagger UI at /swagger-ui.html, OpenAPI at /api-docs. Off by default: it maps every admin route.
springdoc.api-docs.enabled=${app.api-docs-enabled}
springdoc.swagger-ui.enabled=${app.api-docs-enabled}
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.document-title=ValoQuests API
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.packages-to-scan=io.github.thomashtn.valoquests
springdoc.paths-to-match=/api/**
# =============================================================================
# Application settings
# =============================================================================
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:4200}
app.admin-api-key=${ADMIN_API_KEY}
app.api-docs-enabled=${API_DOCS_ENABLED:false}
# Failed X-Admin-Key attempts per remote address before a lockout, and its duration.
app.admin-rate-limit.max-failures=${ADMIN_RATE_LIMIT_MAX_FAILURES:5}
app.admin-rate-limit.lockout-duration=${ADMIN_RATE_LIMIT_LOCKOUT_DURATION:PT1M}
# How long a synchronization that imported nothing stays in the history.
app.synchronization.quiet-history-retention=${SYNC_QUIET_HISTORY_RETENTION:P7D}
# =============================================================================
# Calendar
# =============================================================================
# Zone of every day and week boundary and of every cron below; one value so they never disagree.
app.calendar-zone=${CALENDAR_ZONE:Europe/Paris}
# =============================================================================
# Scheduling
# =============================================================================
# Every five minutes. A quiet pass costs one Henrik call per player; the rank is only re-read
# after a match arrives.
app.scheduling.standard-synchronization-enabled=${STANDARD_SYNC_ENABLED:true}
app.scheduling.standard-synchronization-cron=${STANDARD_SYNC_CRON:0 */5 * * * *}
# Monday 02:05: late Sunday games must have ended, a finalized week never takes matches back.
app.scheduling.week-rollover-enabled=${WEEK_ROLLOVER_ENABLED:true}
app.scheduling.week-rollover-cron=${WEEK_ROLLOVER_CRON:0 5 2 * * MON}
# Daily 00:10: draws the day's challenge and replays the campaign; closing is left to the rollover.
app.scheduling.campaign-tick-enabled=${CAMPAIGN_TICK_ENABLED:true}
app.scheduling.campaign-tick-cron=${CAMPAIGN_TICK_CRON:0 10 0 * * *}
# Daily 03:30: deletes the quiet synchronizations older than the retention above.
app.scheduling.synchronization-history-purge-enabled=${SYNC_HISTORY_PURGE_ENABLED:true}
app.scheduling.synchronization-history-purge-cron=${SYNC_HISTORY_PURGE_CRON:0 30 3 * * *}
# =============================================================================
# Henrik API client
# =============================================================================
henrik.api.base-url=${HENRIK_API_BASE_URL:https://api.henrikdev.xyz}
henrik.api.key=${HENRIK_API_KEY:}
henrik.api.region=${HENRIK_API_REGION:eu}
henrik.api.platform=${HENRIK_API_PLATFORM:pc}
henrik.api.connect-timeout=${HENRIK_API_CONNECT_TIMEOUT:PT5S}
henrik.api.read-timeout=${HENRIK_API_READ_TIMEOUT:PT20S}
# Attempts for a transient failure (timeout, 5xx), first request included.
henrik.api.max-attempts=${HENRIK_API_MAX_ATTEMPTS:4}
# Delay before a retry; a longer Retry-After header wins.
henrik.api.retry-delay=${HENRIK_API_RETRY_DELAY:PT60S}
# Attempts on HTTP 429: throttling is expected on a long walk, so it gets a far larger budget.
henrik.api.rate-limit-max-attempts=${HENRIK_API_RATE_LIMIT_MAX_ATTEMPTS:25}
# Requests per minute, kept just under the provider limit, plus a gap between two requests.
henrik.api.requests-per-minute=${HENRIK_API_REQUESTS_PER_MINUTE:28}
henrik.api.rate-limit-safety-margin=${HENRIK_API_RATE_LIMIT_SAFETY_MARGIN:PT0.1S}
# =============================================================================
# Logging
# =============================================================================
logging.level.io.github.thomashtn.valoquests=INFO
