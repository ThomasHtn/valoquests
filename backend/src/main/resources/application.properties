# =============================================================================
# Application
# =============================================================================
# Application identity used by Spring Boot and Actuator.
spring.application.name=valo-quests
# Admin authentication is handled entirely by AdminApiKeyFilter, not Spring Security's
# UserDetailsService/form-login. Without this exclusion, Boot still auto-configures an in-memory
# user with a random generated password logged at every startup ("Using generated security
# password... not for production use") even though nothing ever authenticates against it.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
# =============================================================================
# Database
# =============================================================================
# PostgreSQL connection. Environment variables override local defaults.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/valo_quests}
spring.datasource.username=${DB_USERNAME:valorant}
spring.datasource.password=${DB_PASSWORD:valorant}
# =============================================================================
# JPA and Hibernate
# =============================================================================
# Flyway manages the schema; Hibernate only validates it at startup.
spring.jpa.hibernate.ddl-auto=validate
# Prevent database access during HTTP response serialization.
spring.jpa.open-in-view=false
# Store and read database timestamps in UTC.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Optimize the loading of lazy associations.
spring.jpa.properties.hibernate.default_batch_fetch_size=50
# =============================================================================
# Flyway
# =============================================================================
# Apply and validate database migrations at startup.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
# =============================================================================
# JSON serialization
# =============================================================================
# Exclude null properties and serialize dates using UTC.
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=UTC
# =============================================================================
# HTTP server
# =============================================================================
# Allow in-flight requests to finish during application shutdown.
server.shutdown=graceful
# Trust X-Forwarded-* from the reverse proxy terminating TLS in front of this application (Traefik,
# see frontend/Dockerfile). Without this, HttpServletRequest reports the proxy rather than the
# caller, and AdminAuthRateLimiter keys every failed X-Admin-Key attempt on that single address —
# turning a per-caller lockout into a global one anybody could trigger against the operator.
# Only safe because the application is never exposed directly: a reachable-without-proxy deployment
# would let a caller forge its own address by sending the header itself.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:framework}
# =============================================================================
# Actuator
# =============================================================================
# Expose only the endpoints SecurityConfig actually opens. `metrics` is deliberately absent: it is
# unauthenticated like the two below, and SecurityConfig's closing denyAll() made it unreachable
# anyway. Re-adding it means first deciding who is allowed to read it.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
# Application metadata exposed through the information endpoint.
info.app.name=${spring.application.name}
info.app.version=@project.version@
# =============================================================================
# OpenAPI and Swagger UI
# =============================================================================
# Swagger UI:   http://localhost:8080/swagger-ui.html
# OpenAPI JSON: http://localhost:8080/api-docs
# OpenAPI YAML: http://localhost:8080/api-docs.yaml
#
# Off unless explicitly switched on. The document describes every /api/admin/** route, its request
# body and its error codes, so publishing it on a reachable deployment maps out the whole
# administrative surface for anyone who asks. Turn it on for local development (.env.example does),
# not in production. SecurityConfig reads the same flag, so the routes and the rule opening them are
# never out of step.
springdoc.api-docs.enabled=${app.api-docs-enabled}
springdoc.swagger-ui.enabled=${app.api-docs-enabled}
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.document-title=Valorant Tracker API
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.try-it-out-enabled=true
# Restrict generated documentation to the application API.
springdoc.packages-to-scan=io.github.thomashtn.valoquests
springdoc.paths-to-match=/api/**
# =============================================================================
# Application settings
# =============================================================================
# Angular frontend origin allowed by the backend.
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:4200}
# Secret used to protect administrative endpoints.
app.admin-api-key=${ADMIN_API_KEY}
# Serves the OpenAPI document and Swagger UI, and opens their routes. See the OpenAPI section above
# for why this stays off outside local development.
app.api-docs-enabled=${API_DOCS_ENABLED:false}
# Failed X-Admin-Key attempts allowed per remote address before a temporary lockout.
app.admin-rate-limit.max-failures=${ADMIN_RATE_LIMIT_MAX_FAILURES:5}
# Duration a remote address stays locked out after exceeding the failure budget above.
app.admin-rate-limit.lockout-duration=${ADMIN_RATE_LIMIT_LOCKOUT_DURATION:PT1M}
# =============================================================================
# Scheduling
# =============================================================================
# Enables the automatic standard synchronization job.
app.scheduling.standard-synchronization-enabled=${STANDARD_SYNC_ENABLED:true}
# Runs on the hour and on the half hour. Every synchronization replays the colony, so this is also
# what makes its gauges follow the day as it is played rather than jump three times a day. A quiet
# pass costs two Henrik calls per player (MMR, then one match page the walk stops on), well inside
# henrik.api.requests-per-minute below.
app.scheduling.standard-synchronization-cron=${STANDARD_SYNC_CRON:0 0/30 * * * *}
# Time zone used by the standard synchronization scheduler.
app.scheduling.zone=${SCHEDULING_ZONE:Europe/Paris}
# Enables the automatic weekly rollover job.
app.scheduling.week-rollover-enabled=${WEEK_ROLLOVER_ENABLED:true}
# Finalizes the previous week every Monday at 00:05, in the zone below.
app.scheduling.week-rollover-cron=${WEEK_ROLLOVER_CRON:0 5 0 * * MON}
# Time zone used by weekly calculations (week boundaries, active days, boss selection) and by the
# rollover cron above. Both must stay on this single property: a mismatch between the calendar zone
# and the cron zone would move end-of-week matches into the wrong week.
app.scheduling.week-rollover-zone=${WEEK_ROLLOVER_ZONE:Europe/Paris}
# Enables the automatic daily colony replay.
app.scheduling.colony-tick-enabled=${COLONY_TICK_ENABLED:true}
# Replays the run in progress every day at 00:15, ten minutes after the Monday rollover so a Monday
# tick already sees the week it has just finalized. Runs in the week-rollover zone above, which is the
# one WeekCalendar splits days on: a tick in another zone would replay days whose boundaries are not
# the ones that produced the gains. The replay is idempotent, so an extra firing is harmless.
app.scheduling.colony-tick-cron=${COLONY_TICK_CRON:0 15 0 * * *}
# =============================================================================
# Henrik API client
# =============================================================================
# HenrikDev connection and authentication.
henrik.api.base-url=${HENRIK_API_BASE_URL:https://api.henrikdev.xyz}
henrik.api.key=${HENRIK_API_KEY:}
# Region and platform shared by all tracked players.
henrik.api.region=${HENRIK_API_REGION:eu}
henrik.api.platform=${HENRIK_API_PLATFORM:pc}
# HTTP connection and response timeouts.
henrik.api.connect-timeout=${HENRIK_API_CONNECT_TIMEOUT:PT5S}
henrik.api.read-timeout=${HENRIK_API_READ_TIMEOUT:PT20S}
# Maximum number of attempts for a genuine transient Henrik failure (timeout, 5xx).
# This value includes the initial request.
henrik.api.max-attempts=${HENRIK_API_MAX_ATTEMPTS:4}
# Delay before retrying a transient Henrik API failure.
# The Retry-After response header takes precedence when it specifies a
# greater delay.
henrik.api.retry-delay=${HENRIK_API_RETRY_DELAY:PT60S}
# Maximum number of attempts when Henrik responds with a rate limit (HTTP 429).
# Rate limiting is an expected condition during a long match-history walk, not a real failure, so it
# gets a much larger budget than henrik.api.max-attempts: giving up here would abort an otherwise
# healthy synchronization only because it ran long enough to be throttled.
# This value includes the initial request.
henrik.api.rate-limit-max-attempts=${HENRIK_API_RATE_LIMIT_MAX_ATTEMPTS:25}
# Maximum number of Henrik API requests per minute.
# A small safety margin is kept below the provider limit.
henrik.api.requests-per-minute=${HENRIK_API_REQUESTS_PER_MINUTE:28}
# Additional safety duration between two consecutive Henrik API requests.
henrik.api.rate-limit-safety-margin=${HENRIK_API_RATE_LIMIT_SAFETY_MARGIN:PT0.1S}
# =============================================================================
# Logging
# =============================================================================
# Default log level for application packages.
logging.level.io.github.thomashtn.valoquests=INFO
